name: Install Rust toolchain
description: "Install Rust toolchain"

inputs:
  toolchain:
    required: true
    description: "Rust toolchain, e.g. 'stable' or 'nightly'"
  working-directory:
    description: "Working directory to run the action in"
    required: false
    default: "."

runs:
  using: "composite"
  steps:
    - name: "Install Rust"
      working-directory: ${{ inputs.working-directory }}
      shell: bash
      env:
        TOOLCHAIN: ${{ inputs.toolchain }}
      run: |
        # The toolchain is written to $GITHUB_ENV, so it may only hold the characters of a toolchain name.
        [[ "$TOOLCHAIN" =~ ^[a-z0-9._-]+$ ]] || { echo "toolchain should consist of lowercase letters, digits, dots, underscores and dashes: $TOOLCHAIN" >&2; exit 1; }

        # regex for components that are only available on nightly and should not be installed on stable
        # these are in variables due to: https://stackoverflow.com/a/56449915/9077988
        NIGHTLY_ONLY="miri|llvm-tools|llvm-tools-preview"
        NIGHTLY_TOOLCHAIN="nightly-.*"

        # extract components from the rust-toolchain.toml 
        COMPONENTS=$(yq -p toml '.toolchain.components[]' rust-toolchain.toml)

        rustup toolchain install "$TOOLCHAIN"

        for component in $COMPONENTS; do
          # depending on the toolchain we need to conditionally skip specific components
          if [[ ! "$TOOLCHAIN" =~ $NIGHTLY_TOOLCHAIN ]]; then
            # ensure that we only install components that are meant for stable
            if [[ ! $component =~ $NIGHTLY_ONLY ]]; then
              rustup component add --toolchain "$TOOLCHAIN" "$component"
            fi
          else
            rustup component add --toolchain "$TOOLCHAIN" "$component"  
          fi
        done

        echo "RUSTUP_TOOLCHAIN=${TOOLCHAIN}" >> "$GITHUB_ENV"
