name: Setup Rust CI
description: Installs uv, Python and the locked dependencies of the Rust CI scripts

runs:
  using: composite
  steps:
    - name: Install uv and Python
      uses: astral-sh/setup-uv@v7.6.0
      with:
        working-directory: .github/scripts/rust
        enable-cache: true
        cache-dependency-glob: uv.lock
    - name: Install dependencies
      shell: bash
      run: uv sync --locked --project .github/scripts/rust
