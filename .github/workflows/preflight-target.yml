name: Preflight

on:
  pull_request:
    paths:
      - ".github/workflows/preflight-target.yml"
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
  merge_group:

permissions: {}

jobs:
  dependencies:
    name: Dependencies
    permissions:
      contents: read
      pull-requests: write
    uses: hashintel/actions/.github/workflows/preflight-dependencies.yml@e67e5da04bf8176a1da5c17a06e94fdc62e8de19 # main

  pr-title:
    name: PR title
    permissions:
      contents: read
    uses: hashintel/actions/.github/workflows/preflight-pr-title.yml@e67e5da04bf8176a1da5c17a06e94fdc62e8de19 # main
