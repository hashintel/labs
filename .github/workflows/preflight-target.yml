name: Preflight

on:
  pull_request:
    paths:
      - ".github/workflows/preflight-target.yml"
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
  merge_group:

permissions: {}

jobs:
  dependencies:
    name: Dependencies
    permissions:
      contents: read
      pull-requests: write
    uses: hashintel/actions/.github/workflows/preflight-dependencies.yml@58e907dddafebb9219262b524e2b7f2130716a8a # main

  pr-title:
    name: PR title
    permissions:
      contents: read
    uses: hashintel/actions/.github/workflows/preflight-pr-title.yml@58e907dddafebb9219262b524e2b7f2130716a8a # main
