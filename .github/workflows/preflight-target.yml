name: Preflight

on:
  pull_request:
    paths:
      - ".github/workflows/preflight-target.yml"
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
  merge_group:

permissions: {}

jobs:
  dependencies:
    name: Dependencies
    permissions:
      contents: read
      pull-requests: write
    uses: hashintel/actions/.github/workflows/preflight-dependencies.yml@06238755f2364521d75a1eaf0b3b397261f46077 # main

  pr-title:
    name: PR title
    permissions:
      contents: read
    uses: hashintel/actions/.github/workflows/preflight-pr-title.yml@06238755f2364521d75a1eaf0b3b397261f46077 # main
