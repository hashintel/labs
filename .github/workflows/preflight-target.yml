name: Preflight

on:
  pull_request:
    paths:
      - ".github/workflows/preflight-target.yml"
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
  merge_group:

permissions: {}

jobs:
  dependencies:
    name: Dependencies
    permissions:
      contents: read
      pull-requests: write
    uses: hashintel/actions/.github/workflows/preflight-dependencies.yml@5495f1b4c301fd582eb366b2c0ed12e71ebb58a7 # main

  pr-title:
    name: PR title
    permissions:
      contents: read
    uses: hashintel/actions/.github/workflows/preflight-pr-title.yml@5495f1b4c301fd582eb366b2c0ed12e71ebb58a7 # main
