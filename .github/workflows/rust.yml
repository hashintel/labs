name: Rust

on:
  pull_request:
  push:
    branches:
      - main
      - dev/**
  merge_group:

defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

env:
  CARGO_TERM_COLOR: always

jobs:
  setup:
    name: setup
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      lint: ${{ steps.crates.outputs.lint }}
      test: ${{ steps.crates.outputs.test }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6.0.2
        with:
          fetch-depth: 2

      - name: Setup CI
        uses: $/.github/actions/setup-rust-ci

      - name: Find changed crates
        id: crates
        run: |
          GITHUB_OUTPUT_FILE_PATH=$(mktemp)
          export GITHUB_OUTPUT_FILE_PATH
          uv run --locked --project .github/scripts/rust python .github/scripts/rust/setup.py
          cat "$GITHUB_OUTPUT_FILE_PATH" >> "$GITHUB_OUTPUT"

  lint:
    name: lint
    needs: setup
    if: ${{ needs.setup.outputs.lint != '{}' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write # upload-sarif publishes the clippy findings to code scanning
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.lint) }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6.0.2

      - name: Install Rust toolchain
        uses: $/.github/actions/install-rust-toolchain
        with:
          toolchain: ${{ matrix.toolchain }}
          working-directory: ${{ matrix.directory }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2.8.2
        with:
          workspaces: ${{ matrix.directory }}
          save-if: ${{ !startsWith(github.ref, 'refs/heads/gh-readonly-queue') }}
          cache-all-crates: true

      - name: Install tools
        uses: taiki-e/install-action@v2.62.59
        with:
          tool: cargo-hack@0.5.26,rust-script@0.23.0,clippy-sarif@0.3.7,sarif-fmt@0.3.7

      - name: Check formatting
        working-directory: ${{ matrix.directory }}
        run: cargo fmt --all --check

      - name: Check clippy
        working-directory: ${{ matrix.directory }}
        if: ${{ always() }}
        run: |
          cargo clippy --workspace --all-features --all-targets --no-deps --message-format=json \
            | clippy-sarif \
            | jq '.runs[].results |= unique' \
            | tee clippy.sarif \
            | sarif-fmt

          jq -e '.runs[].results == []' clippy.sarif> /dev/null

      - name: Process SARIF file
        working-directory: ${{ matrix.directory }}
        if: ${{ always() }}
        env:
          DIRECTORY: ${{ matrix.directory }}
        run: |
          tmp=$(mktemp)

          jq --arg pwd "$DIRECTORY" '.runs[].results[].locations[].physicalLocation.artifactLocation.uri |= $pwd + "/" + .' clippy.sarif > "$tmp"

          mv "$tmp" clippy.sarif

      - name: Upload SARIF file
        uses: github/codeql-action/upload-sarif@v4.31.5
        if: ${{ always() }}
        with:
          sarif_file: ${{ matrix.directory }}/clippy.sarif
          category: ${{ matrix.name }}

      - name: Check public documentation
        working-directory: ${{ matrix.directory }}
        if: ${{ always() }}
        env:
          RUSTDOCFLAGS: "--check -Z unstable-options -D warnings"
        run: cargo doc --workspace --all-features --no-deps

      - name: Check private documentation
        working-directory: ${{ matrix.directory }}
        if: ${{ always() }}
        env:
          RUSTDOCFLAGS: "--check -Z unstable-options -D warnings"
        run: cargo doc --workspace --all-features --no-deps --document-private-items

      - name: Ensure empty git diff
        run: git --no-pager diff --exit-code --color

  test:
    name: test
    needs: setup
    if: ${{ always() && needs.setup.outputs.test != '{}' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.setup.outputs.test) }}
    env:
      OUTPUT_DIRECTORY: test-results
      RUST_BACKTRACE: 1
      PROFILE: ${{ matrix.profile }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v6.0.2

      - name: Install Rust toolchain
        uses: $/.github/actions/install-rust-toolchain
        with:
          toolchain: ${{ matrix.toolchain }}
          working-directory: ${{ matrix.directory }}

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@v2.8.2
        with:
          workspaces: ${{ matrix.directory }}
          key: ${{ matrix.profile }}
          save-if: ${{ !startsWith(github.ref, 'refs/heads/gh-readonly-queue') }}
          cache-all-crates: true

      - name: Install tools
        uses: taiki-e/install-action@v2.62.59
        with:
          tool: cargo-nextest@0.9.37

      - name: Install Python
        if: ${{ matrix.directory == 'apps/sim-engine' }}
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.10"

      - name: Prepare tests
        if: ${{ matrix.directory == 'apps/sim-engine' }}
        working-directory: ${{ matrix.directory }}
        run: |
          cargo build --profile "$PROFILE" -p memory
          bash lib/execution/src/runner/python/setup.sh python3.10

      - name: Run tests
        working-directory: ${{ matrix.directory }}
        run: cargo nextest run --cargo-profile "$PROFILE" --workspace --all-features

      - name: Run miri
        if: ${{ startsWith(matrix.toolchain, 'nightly') }}
        working-directory: ${{ matrix.directory }}
        run: cargo miri test --workspace --all-features --all-targets --no-fail-fast

      - name: Ensure empty git diff
        run: git --no-pager diff --exit-code --color

  merging-enabled:
    name: Merging enabled
    needs: [setup, lint, test]
    if: ${{ always() }}
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    permissions: {}
    env:
      SETUP_RESULT: ${{ needs.setup.result }}
      LINT_RESULT: ${{ needs.lint.result }}
      TEST_RESULT: ${{ needs.test.result }}
    steps:
      - name: check setup
        run: |
          [[ $SETUP_RESULT = success ]]
      - name: check lint
        run: |
          [[ $LINT_RESULT =~ success|skipped ]]
      - name: check test
        run: |
          [[ $TEST_RESULT =~ success|skipped ]]
