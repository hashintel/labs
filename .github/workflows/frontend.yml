name: Frontend

on:
  pull_request:
    paths:
      - "apps/sim-core/**"
      - ".github/workflows/frontend.yml"
  push:
    branches:
      - main
    paths:
      - "apps/sim-core/**"
      - ".github/workflows/frontend.yml"

defaults:
  run:
    shell: bash
    working-directory: apps/sim-core/packages/core

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "24"
          cache: yarn
          cache-dependency-path: apps/sim-core/yarn.lock

      - name: Install dependencies
        working-directory: apps/sim-core
        run: yarn install --frozen-lockfile --ignore-scripts

      # @hashintel/engine-web is a WASM package built from Rust and isn't
      # checked into git. `yarn install --ignore-scripts` above skips the
      # postinstall step that would normally build it, so it's built
      # explicitly here instead.
      - name: Install Rust toolchain
        working-directory: apps/sim-core
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustup target add wasm32-unknown-unknown

      - name: Cache Rust dependencies
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          workspaces: apps/sim-core
          save-if: ${{ !startsWith(github.ref, 'refs/heads/gh-readonly-queue') }}

      - name: Install wasm-pack
        uses: taiki-e/install-action@b4b80945859e8ef89a9732a0f46499a443b196fe # v2.62.59
        with:
          tool: wasm-pack@0.13.1

      - name: Build @hashintel/utils
        working-directory: apps/sim-core
        run: yarn build:utils

      - name: Build @hashintel/engine-web
        working-directory: apps/sim-core
        run: yarn build:engine-web

      - name: ESLint
        run: npx eslint --quiet "src/**/*.{ts,tsx}"

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Unit tests
        run: npx jest --forceExit --testPathIgnorePatterns "/node_modules/|/tests/e2e/"

      - name: Production build
        env:
          # The bundle (Monaco + Three.js + Plotly + FluentUI, etc.) is large
          # enough that Vite's default heap can OOM.
          NODE_OPTIONS: --max-old-space-size=6144
        run: yarn build
