[project]
name = "slug-from-embedding"
version = "0.1.0"
description = "Research: generating slugs from content embeddings"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "absl-py>=2.4.0",
    "anthropic>=0.102.0",
    "bert-score>=0.3.13",
    "datasets>=4.8.5",
    "datatrove[io,processing]>=0.9.0",
    "duckdb>=1.5.2",
    "evaluate>=0.4.6",
    "nltk>=3.9.4",
    "openai>=2.36.0",
    "python-dotenv>=1.2.2",
    "rouge-score>=0.1.2",
    "scikit-learn>=1.8.0",
    "seaborn>=0.13.2",
    "spacy>=3.8.14",
    "tokenizers<=0.23.0",
    "torch>=2.12.0",
    "transformers>=4.57.6",
    "umap-learn>=0.5.12",
]

[project.scripts]
slug-prepare = "slug_from_embedding.prepare_corpus:main"
slug-distill = "slug_from_embedding.distill_slugs:main"
slug-embed = "slug_from_embedding.embed_corpus:main"
slug-split = "slug_from_embedding.split_dataset:main"
slug-baseline = "slug_from_embedding.baselines:main"
slug-eval = "slug_from_embedding.evaluation:main"
slug-report = "slug_from_embedding.report:main"
slug-prepare-urls = "slug_from_embedding.prepare_url_corpus:main"
slug-train-mlp = "slug_from_embedding.training.mlp.train:main"
slug-train-seq2seq = "slug_from_embedding.training.seq2seq.train:main"
slug-predict = "slug_from_embedding.training.predict_cli:main"
slug-compress-vocab = "slug_from_embedding.compress_vocab:main"
slug-visualize-vocab = "slug_from_embedding.visualize_vocab:main"
slug-analyze-attention = "slug_from_embedding.analyze_attention:main"

[tool.uv]
package = true
