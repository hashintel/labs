# =============================================================================
# SAP MOCK DATA SCHEMA DOCUMENTATION
# =============================================================================
# This file is the source of truth for table and column descriptions.
# It includes primary keys, foreign keys, and standardized field descriptions.
#
# Structure:
#   tables:
#     table_name:
#       description: Table description
#       primary_key: [list of PK columns]
#       foreign_keys:
#         - columns: [FK columns]
#           references: {table: ref_table, columns: [ref_columns]}
#       columns:
#         column_name:
#           description: Column description
#           data_type: Data type
#           nullable: true/false
# =============================================================================

_metadata:
  catalog: sample_synthetic_sap
  schema: sap
  exported_at: '2026-02-26'
  exported_by: Schema Documentation System
  description: >
    SAP Mock Data schema documentation. This file is the source of truth for
    table and column descriptions, primary keys, and foreign key relationships.

# =============================================================================
# CANONICAL FIELD DEFINITIONS
# =============================================================================
# Common SAP fields used consistently across tables:
#
#   MANDT    - Client (SAP system identifier)
#   MATNR    - Material Number
#   WERKS    - Plant
#   LGORT    - Storage Location
#   CHARG    - Batch Number
#   KUNNR    - Customer Number
#   LIFNR    - Vendor Number
#   AUFNR    - Production Order Number
#   VBELN    - Document Number (Sales/Delivery/Shipment)
#   POSNR    - Item Number
#   ERDAT    - Created Date
#   AEDAT    - Changed Date
#   MEINS    - Base Unit of Measure
#   WAERS    - Currency
#   MENGE    - Quantity
#   BUDAT    - Posting Date
#   NETWR    - Net Value
#   NETPR    - Net Price
# =============================================================================

tables:

  # ===========================================================================
  # MATERIAL MASTER DATA
  # ===========================================================================

  mara:
    description: |
      **SAP Table MARA - General Material Data**

      Contains basic material master data applicable across all organizational levels.
      This is the central material master table in SAP.
    primary_key: [MANDT, MATNR]
    columns:
      MANDT:
        description: Client
        data_type: STRING
        nullable: false
      MATNR:
        description: Material Number
        data_type: STRING
        nullable: false
      MTART:
        description: Material Type (FERT=Finished Good, ROH=Raw Material)
        data_type: STRING
        nullable: true
      MATKL:
        description: Material Group
        data_type: STRING
        nullable: true
      MEINS:
        description: Base Unit of Measure
        data_type: STRING
        nullable: true
      BRGEW:
        description: Gross Weight
        data_type: DOUBLE
        nullable: true

  makt:
    description: |
      **SAP Table MAKT - Material Descriptions**

      Contains material description texts in multiple languages.
    primary_key: [MANDT, MATNR, SPRAS]
    foreign_keys:
      - columns: [MANDT, MATNR]
        references: {table: mara, columns: [MANDT, MATNR]}
    columns:
      MANDT:
        description: Client
        data_type: STRING
        nullable: false
      MATNR:
        description: Material Number
        data_type: STRING
        nullable: false
      SPRAS:
        description: Language Key
        data_type: STRING
        nullable: false
      MAKTX:
        description: Material Description Text
        data_type: STRING
        nullable: true

  marc:
    description: |
      **SAP Table MARC - Plant Data for Material**

      Contains material master data specific to a plant, including MRP and
      procurement settings.
    primary_key: [MANDT, MATNR, WERKS]
    foreign_keys:
      - columns: [MANDT, MATNR]
        references: {table: mara, columns: [MANDT, MATNR]}
    columns:
      MANDT:
        description: Client
        data_type: STRING
        nullable: false
      MATNR:
        description: Material Number
        data_type: STRING
        nullable: false
      WERKS:
        description: Plant
        data_type: STRING
        nullable: false
      BESKZ:
        description: Procurement Type (E=In-house Production, F=External Procurement)
        data_type: STRING
        nullable: true
      BSTMI:
        description: Minimum Order Quantity
        data_type: LONG
        nullable: true
      BSTMA:
        description: Maximum Order Quantity
        data_type: LONG
        nullable: true
      BSTFE:
        description: Fixed Lot Size
        data_type: LONG
        nullable: true
      BSTRF:
        description: Rounding Value for Order Quantity
        data_type: LONG
        nullable: true
      LGPRO:
        description: Production Storage Location
        data_type: STRING
        nullable: true
      DISPO:
        description: MRP Controller
        data_type: STRING
        nullable: true
      EISBE:
        description: Safety Stock Quantity
        data_type: LONG
        nullable: true

  mard:
    description: |
      **SAP Table MARD - Storage Location Data for Material**

      Contains inventory data at the storage location level. This is where
      current stock quantities are maintained.
    primary_key: [MANDT, MATNR, WERKS, LGORT]
    foreign_keys:
      - columns: [MANDT, MATNR, WERKS]
        references: {table: marc, columns: [MANDT, MATNR, WERKS]}
    columns:
      MANDT:
        description: Client
        data_type: STRING
        nullable: false
      MATNR:
        description: Material Number
        data_type: STRING
        nullable: false
      WERKS:
        description: Plant
        data_type: STRING
        nullable: false
      LGORT:
        description: Storage Location
        data_type: STRING
        nullable: false
      CHARG:
        description: Batch Number
        data_type: STRING
        nullable: true
      LABST:
        description: Unrestricted Stock Quantity
        data_type: DOUBLE
        nullable: true

  mardh:
    description: |
      **SAP Table MARDH - Historical Storage Location Data**

      Contains historical inventory snapshots by fiscal period (year/month)
      for tracking stock level changes over time.
    primary_key: [MANDT, MATNR, WERKS, LGORT, CHARG, LFGJA, LFMON]
    foreign_keys:
      - columns: [MANDT, MATNR]
        references: {table: mara, columns: [MANDT, MATNR]}
    columns:
      MANDT:
        description: Client
        data_type: STRING
        nullable: false
      MATNR:
        description: Material Number
        data_type: STRING
        nullable: false
      WERKS:
        description: Plant
        data_type: STRING
        nullable: false
      LGORT:
        description: Storage Location
        data_type: STRING
        nullable: false
      CHARG:
        description: Batch Number
        data_type: STRING
        nullable: true
      LFGJA:
        description: Fiscal Year
        data_type: STRING
        nullable: false
      LFMON:
        description: Fiscal Period (Month)
        data_type: STRING
        nullable: false
      LABST:
        description: Unrestricted Stock Quantity
        data_type: DOUBLE
        nullable: true
      UMLME:
        description: Stock in Transfer
        data_type: LONG
        nullable: true
      INSME:
        description: Quality Inspection Stock
        data_type: LONG
        nullable: true
      EINME:
        description: Restricted Stock
        data_type: LONG
        nullable: true
      SPEME:
        description: Blocked Stock
        data_type: LONG
        nullable: true
      RETME:
        description: Returns Stock
        data_type: LONG
        nullable: true
      VKLAB:
        description: Consignment Stock from Vendor
        data_type: DOUBLE
        nullable: true
      VKUML:
        description: Consignment Stock in Transfer
        data_type: DOUBLE
        nullable: true

  marm:
    description: |
      **SAP Table MARM - Units of Measure for Material**

      Contains alternative units of measure and conversion factors for materials.
    primary_key: [MANDT, MATNR, MEINH]
    foreign_keys:
      - columns: [MANDT, MATNR]
        references: {table: mara, columns: [MANDT, MATNR]}
    columns:
      MANDT:
        description: Client
        data_type: STRING
        nullable: false
      MATNR:
        description: Material Number
        data_type: STRING
        nullable: false
      MEINH:
        description: Alternative Unit of Measure
        data_type: STRING
        nullable: false
      UMREZ:
        description: Numerator for Conversion to Base UoM
        data_type: LONG
        nullable: true
      UMREN:
        description: Denominator for Conversion to Base UoM
        data_type: DOUBLE
        nullable: true
      LAENG:
        description: Length
        data_type: LONG
        nullable: true
      BREIT:
        description: Width
        data_type: LONG
        nullable: true
      HOEHE:
        description: Height
        data_type: LONG
        nullable: true
      VOLUM:
        description: Volume
        data_type: DOUBLE
        nullable: true
      VOLEH:
        description: Volume Unit
        data_type: STRING
        nullable: true
      BRGEW:
        description: Gross Weight
        data_type: DOUBLE
        nullable: true
      GEWEI:
        description: Weight Unit
        data_type: STRING
        nullable: true

  mbew:
    description: |
      **SAP Table MBEW - Material Valuation**

      Contains material valuation data including prices and stock values
      at the valuation area (typically plant) level.
    primary_key: [MANDT, MATNR, BWKEY]
    foreign_keys:
      - columns: [MANDT, MATNR]
        references: {table: mara, columns: [MANDT, MATNR]}
    columns:
      MANDT:
        description: Client
        data_type: STRING
        nullable: false
      MATNR:
        description: Material Number
        data_type: STRING
        nullable: false
      BWKEY:
        description: Valuation Area (Plant)
        data_type: STRING
        nullable: false
      WAERS:
        description: Currency
        data_type: STRING
        nullable: true
      VPRSV:
        description: Price Control (S=Standard, V=Moving Average)
        data_type: STRING
        nullable: true
      VERPR:
        description: Moving Average Price
        data_type: DOUBLE
        nullable: true
      STPRS:
        description: Standard Price
        data_type: DOUBLE
        nullable: true
      PEINH:
        description: Price Unit
        data_type: LONG
        nullable: true
      LBKUM:
        description: Total Valuated Stock Quantity
        data_type: DOUBLE
        nullable: true
      SALK3:
        description: Total Stock Value
        data_type: DOUBLE
        nullable: true
      ZKPRS:
        description: Future Price
        data_type: DOUBLE
        nullable: true
      ZKDAT:
        description: Future Price Valid From Date
        data_type: STRING
        nullable: true
      BKLAS:
        description: Valuation Class
        data_type: STRING
        nullable: true

  # ===========================================================================
  # BATCH MASTER DATA
  # ===========================================================================

  mch1:
    description: |
      **SAP Table MCH1 - Batch Master (Client Level)**

      Contains batch master data at the client level, applicable across all plants.
    primary_key: [MANDT, MATNR, CHARG]
    foreign_keys:
      - columns: [MANDT, MATNR]
        references: {table: mara, columns: [MANDT, MATNR]}
    columns:
      MANDT:
        description: Client
        data_type: STRING
        nullable: false
      MATNR:
        description: Material Number
        data_type: STRING
        nullable: false
      CHARG:
        description: Batch Number
        data_type: STRING
        nullable: false
      ZZ_BATCH_VERSION:
        description: Batch Status
        data_type: STRING
        nullable: true
      HSDAT:
        description: Production Date
        data_type: STRING
        nullable: true
      VFDAT:
        description: Shelf Life Expiration Date
        data_type: STRING
        nullable: true
      LWEDT:
        description: Last Status Change Date
        data_type: STRING
        nullable: true
      ZZ_LAST_GI_DATE:
        description: Last Goods Movement Date
        data_type: STRING
        nullable: true
      ZUSTD:
        description: Batch Status Code
        data_type: STRING
        nullable: true
      ZZ_RESTRICTION_REASON:
        description: Batch Restriction
        data_type: STRING
        nullable: true
      ZZ_ORIGIN_PLANT:
        description: Origin
        data_type: STRING
        nullable: true
      LOBM_LIFNR:
        description: Vendor Number for Batch
        data_type: STRING
        nullable: true

  mcha:
    description: |
      **SAP Table MCHA - Batch Master (Plant Level)**

      Contains batch master data at the plant level with stock quantities.
    primary_key: [MANDT, MATNR, WERKS, CHARG]
    foreign_keys:
      - columns: [MANDT, MATNR]
        references: {table: mara, columns: [MANDT, MATNR]}
    columns:
      MANDT:
        description: Client
        data_type: STRING
        nullable: false
      MATNR:
        description: Material Number
        data_type: STRING
        nullable: false
      WERKS:
        description: Plant
        data_type: STRING
        nullable: false
      CHARG:
        description: Batch Number
        data_type: STRING
        nullable: false
      LVORM:
        description: Deletion Flag
        data_type: STRING
        nullable: true
      ERSDA:
        description: Created Date
        data_type: STRING
        nullable: true
      ERNAM:
        description: Created By
        data_type: STRING
        nullable: true
      VFDAT:
        description: Shelf Life Expiration Date
        data_type: STRING
        nullable: true
      ZUSTD:
        description: Batch Status Code
        data_type: STRING
        nullable: true
      CLABS:
        description: Unrestricted Batch Stock
        data_type: DOUBLE
        nullable: true
      CUMLM:
        description: Batch Stock in Transfer
        data_type: LONG
        nullable: true
      CINSM:
        description: Batch Stock in Quality Inspection
        data_type: LONG
        nullable: true
      CEINM:
        description: Restricted Batch Stock
        data_type: LONG
        nullable: true
      CSPEM:
        description: Blocked Batch Stock
        data_type: LONG
        nullable: true

  # ===========================================================================
  # BILL OF MATERIALS (BOM)
  # ===========================================================================

  mast:
    description: |
      **SAP Table MAST - Material to BOM Link**

      Links materials to their bill of materials. The parent material (finished
      good) is stored here, linking to BOM header in STKO.
    primary_key: [MANDT, MATNR, WERKS, STLAN]
    foreign_keys:
      - columns: [MANDT, MATNR]
        references: {table: mara, columns: [MANDT, MATNR]}
      - columns: [MANDT, MATNR, WERKS]
        references: {table: marc, columns: [MANDT, MATNR, WERKS]}
    columns:
      MANDT:
        description: Client
        data_type: STRING
        nullable: false
      MATNR:
        description: Material Number (Parent/Finished Good)
        data_type: STRING
        nullable: false
      WERKS:
        description: Plant
        data_type: STRING
        nullable: false
      STLAN:
        description: BOM Usage (1=Production)
        data_type: STRING
        nullable: false
      STLNR:
        description: BOM Number
        data_type: STRING
        nullable: false
      STLAL:
        description: Alternative BOM
        data_type: STRING
        nullable: true

  stko:
    description: |
      **SAP Table STKO - BOM Header**

      Contains bill of materials header data including base quantity and validity.
    primary_key: [MANDT, STLTY, STLNR, STLAL]
    columns:
      MANDT:
        description: Client
        data_type: STRING
        nullable: false
      STLTY:
        description: BOM Category (M=Material BOM)
        data_type: STRING
        nullable: false
      STLNR:
        description: BOM Number
        data_type: STRING
        nullable: false
      STLAL:
        description: Alternative BOM
        data_type: STRING
        nullable: false
      BMENG:
        description: Base Quantity
        data_type: LONG
        nullable: true
      BMEIN:
        description: Base Unit of Measure
        data_type: STRING
        nullable: true
      DATUV:
        description: Valid From Date
        data_type: STRING
        nullable: true

  stpo:
    description: |
      **SAP Table STPO - BOM Item**

      Contains bill of materials component items. The finished good (parent)
      is NOT in this table - it is found in MAST. This table contains the
      raw material components.
    primary_key: [MANDT, STLTY, STLNR, STLAL, STLKN]
    foreign_keys:
      - columns: [MANDT, IDNRK]
        references: {table: mara, columns: [MANDT, MATNR]}
    columns:
      MANDT:
        description: Client
        data_type: STRING
        nullable: false
      STLTY:
        description: BOM Category
        data_type: STRING
        nullable: false
      STLNR:
        description: BOM Number
        data_type: STRING
        nullable: false
      STLAL:
        description: Alternative BOM
        data_type: STRING
        nullable: false
      STLKN:
        description: BOM Item Counter
        data_type: LONG
        nullable: false
      IDNRK:
        description: Component Material Number
        data_type: STRING
        nullable: true
      MENGE:
        description: Component Quantity
        data_type: LONG
        nullable: true
      MEINS:
        description: Component Unit of Measure
        data_type: STRING
        nullable: true

  # ===========================================================================
  # CUSTOMER MASTER DATA
  # ===========================================================================

  kna1:
    description: |
      **SAP Table KNA1 - General Data in Customer Master**

      Contains customer master data including name, address, and account group.
    primary_key: [MANDT, KUNNR]
    columns:
      MANDT:
        description: Client
        data_type: STRING
        nullable: false
      KUNNR:
        description: Customer Number
        data_type: STRING
        nullable: false
      NAME1:
        description: Customer Name
        data_type: STRING
        nullable: true
      ORT01:
        description: City
        data_type: STRING
        nullable: true
      PSTLZ:
        description: Postal Code
        data_type: STRING
        nullable: true
      LAND1:
        description: Country Code
        data_type: STRING
        nullable: true
      KTGRD:
        description: Account Group
        data_type: STRING
        nullable: true
      ERDAT:
        description: Created Date
        data_type: STRING
        nullable: true

  # ===========================================================================
  # VENDOR MASTER DATA
  # ===========================================================================

  lfa1:
    description: |
      **SAP Table LFA1 - Vendor Master (General Section)**

      Contains general vendor master data including name and address information.
    primary_key: [MANDT, LIFNR]
    columns:
      MANDT:
        description: Client
        data_type: STRING
        nullable: false
      LIFNR:
        description: Vendor Number
        data_type: STRING
        nullable: false
      NAME1:
        description: Vendor Name
        data_type: STRING
        nullable: true
      NAME2:
        description: Vendor Name 2
        data_type: STRING
        nullable: true
      LAND1:
        description: Country Code
        data_type: STRING
        nullable: true
      ORT01:
        description: City
        data_type: STRING
        nullable: true
      PSTLZ:
        description: Postal Code
        data_type: STRING
        nullable: true
      STRAS:
        description: Street Address
        data_type: STRING
        nullable: true
      TELF1:
        description: Telephone Number
        data_type: STRING
        nullable: true
      KTOKK:
        description: Vendor Account Group
        data_type: STRING
        nullable: true
      ERDAT:
        description: Created Date
        data_type: STRING
        nullable: true
      ERNAM:
        description: Created By
        data_type: STRING
        nullable: true
      LOEVM:
        description: Central Deletion Flag
        data_type: STRING
        nullable: true
      SPERR:
        description: Central Posting Block
        data_type: STRING
        nullable: true

  # ===========================================================================
  # PURCHASING INFO RECORDS
  # ===========================================================================

  eina:
    description: |
      **SAP Table EINA - Purchasing Info Record (General Data)**

      Contains general purchasing information for material-vendor combinations.
    primary_key: [MANDT, INFNR]
    foreign_keys:
      - columns: [MANDT, MATNR]
        references: {table: mara, columns: [MANDT, MATNR]}
      - columns: [MANDT, LIFNR]
        references: {table: lfa1, columns: [MANDT, LIFNR]}
    columns:
      MANDT:
        description: Client
        data_type: STRING
        nullable: false
      INFNR:
        description: Purchasing Info Record Number
        data_type: STRING
        nullable: false
      MATNR:
        description: Material Number
        data_type: STRING
        nullable: true
      LIFNR:
        description: Vendor Number
        data_type: STRING
        nullable: true
      LOEKZ:
        description: Deletion Indicator
        data_type: STRING
        nullable: true
      ERDAT:
        description: Created Date
        data_type: STRING
        nullable: true
      ERNAM:
        description: Created By
        data_type: STRING
        nullable: true

  eine:
    description: |
      **SAP Table EINE - Purchasing Info Record (Org Data)**

      Contains purchasing organization specific data including pricing and conditions.
    primary_key: [MANDT, INFNR, EKORG, ESOKZ, WERKS]
    foreign_keys:
      - columns: [MANDT, INFNR]
        references: {table: eina, columns: [MANDT, INFNR]}
    columns:
      MANDT:
        description: Client
        data_type: STRING
        nullable: false
      INFNR:
        description: Purchasing Info Record Number
        data_type: STRING
        nullable: false
      EKORG:
        description: Purchasing Organization
        data_type: STRING
        nullable: false
      ESOKZ:
        description: Purchasing Info Record Category
        data_type: STRING
        nullable: false
      WERKS:
        description: Plant
        data_type: STRING
        nullable: false
      LOEKZ:
        description: Deletion Indicator
        data_type: STRING
        nullable: true
      APLFZ:
        description: Planned Delivery Time (Days)
        data_type: LONG
        nullable: true
      NETPR:
        description: Net Price
        data_type: DOUBLE
        nullable: true
      WAERS:
        description: Currency
        data_type: STRING
        nullable: true
      PEINH:
        description: Price Unit
        data_type: LONG
        nullable: true
      BPRME:
        description: Order Price Unit
        data_type: STRING
        nullable: true
      MINBM:
        description: Minimum Order Quantity
        data_type: LONG
        nullable: true
      NORBM:
        description: Standard Order Quantity
        data_type: LONG
        nullable: true
      MWSKZ:
        description: Tax Code
        data_type: STRING
        nullable: true
      INCO1:
        description: Incoterms Part 1
        data_type: STRING
        nullable: true
      INCO2:
        description: Incoterms Part 2
        data_type: STRING
        nullable: true
      WEBRE:
        description: GR-Based Invoice Verification
        data_type: STRING
        nullable: true

  # ===========================================================================
  # PURCHASE ORDERS
  # ===========================================================================

  ekko:
    description: |
      **SAP Table EKKO - Purchasing Document Header**

      Contains purchase order header data including vendor, dates, and status information.
    primary_key: [MANDT, EBELN]
    foreign_keys:
      - columns: [MANDT, LIFNR]
        references: {table: lfa1, columns: [MANDT, LIFNR]}
    columns:
      MANDT:
        description: Client
        data_type: STRING
        nullable: false
      EBELN:
        description: Purchasing Document Number
        data_type: STRING
        nullable: false
      BUKRS:
        description: Company Code
        data_type: STRING
        nullable: true
      BSTYP:
        description: Purchasing Document Category (F=Standard PO)
        data_type: STRING
        nullable: true
      BSART:
        description: Purchasing Document Type (NB=Standard PO)
        data_type: STRING
        nullable: true
      LIFNR:
        description: Vendor Number
        data_type: STRING
        nullable: true
      EKORG:
        description: Purchasing Organization
        data_type: STRING
        nullable: true
      EKGRP:
        description: Purchasing Group
        data_type: STRING
        nullable: true
      WAERS:
        description: Currency
        data_type: STRING
        nullable: true
      BEDAT:
        description: Purchasing Document Date
        data_type: STRING
        nullable: true
      AEDAT:
        description: Changed Date
        data_type: STRING
        nullable: true
      ERNAM:
        description: Created By
        data_type: STRING
        nullable: true
      KONNR:
        description: Contract Number
        data_type: STRING
        nullable: true
      FRGKE:
        description: Release Status (2=Released)
        data_type: STRING
        nullable: true
      FRGZU:
        description: Release Indicator
        data_type: STRING
        nullable: true
      PROCSTAT:
        description: Processing Status (05=Released)
        data_type: STRING
        nullable: true

  ekpo:
    description: |
      **SAP Table EKPO - Purchasing Document Item**

      Contains purchase order line item details including material, quantity, and pricing.
