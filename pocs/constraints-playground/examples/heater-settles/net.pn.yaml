  Warm:
  Draft:

transitions:
  Heat:
    inputs:
      Cold:
    outputs:
      Warm:
  Cool:
    inputs:
      Warm:
      Draft:
    outputs:
      Cold:

marking:
  Cold: 1
  Draft: 2
