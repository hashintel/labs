    inputs:
      Submitted:
    outputs:
      InReview:
  Approve:
    inputs:
      InReview:
      Signer:
    outputs:
      Approved:
  Escalate:
    inputs:
      InReview:
      Timer:
    outputs:
      Overdue:

marking:
  Submitted: 1
