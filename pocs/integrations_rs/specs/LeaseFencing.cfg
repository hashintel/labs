\* Honest deployment: drifting clocks whose pairwise disagreement stays
\* inside the declared clock_skew envelope (A4 holds). Timing values are
\* the previous fixed point; see LeaseFencingSweep.cfg for the range check.
\* Expect: no violations.
CONSTANTS
  Workers = {w1, w2}
  NoOwner = NoOwner
  LeaseDurations = {6}
  GraphChunkDeadlines = {1}
  CursorCommitDeadlines = {1}
  SafetyMargins = {1}
  ClockSkew = 1
  ActualSkewBound = 1
  MaxTime = 10
  MaxVer = 5
  ChunkSlots = 2
INIT Init
NEXT Next
INVARIANTS TypeOK ChunkExclusion
CONSTRAINT StateBound
SYMMETRY Sym
CHECK_DEADLOCK FALSE
