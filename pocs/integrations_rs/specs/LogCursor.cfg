\* Honest journal: storage-epoch fencing at append (axiom B2 holds). Two
\* writers race opens, recoveries, appends, ambiguous appends, and crashes.
\* Expect: no violations.
CONSTANTS
  Writers = {w1, w2}
  Events = {e1, e2}
  MaxAppends = 4
  MaxEpochs = 4
  FenceAtAppend = TRUE
INIT Init
NEXT Next
INVARIANTS TypeOK AckImpliesDurable AdoptionImpliesDurable AckSurvivesRecovery ServedProjectionCurrent AppliedAtMostOnce NoDuplicateIdentity
PROPERTY DurableEndNeverRegresses
SYMMETRY Sym
CHECK_DEADLOCK FALSE
