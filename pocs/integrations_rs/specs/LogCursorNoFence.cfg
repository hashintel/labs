\* Falsification: no fence at append (axiom B2 dropped) -- any open writer's
\* appends land, as on a log without storage epochs. Expect: TLC finds a
\* counterexample where a stale writer appends and acknowledges behind the
\* newest writer's recovered prefix, violating ServedProjectionCurrent /
\* AckSurvivesRecovery -- the claims the append fence carries.
CONSTANTS
  Writers = {w1, w2}
  Events = {e1, e2}
  MaxAppends = 4
  MaxEpochs = 4
  FenceAtAppend = FALSE
INIT Init
NEXT Next
INVARIANTS TypeOK AckImpliesDurable AdoptionImpliesDurable AckSurvivesRecovery ServedProjectionCurrent AppliedAtMostOnce
PROPERTY DurableEndNeverRegresses
SYMMETRY Sym
CHECK_DEADLOCK FALSE
