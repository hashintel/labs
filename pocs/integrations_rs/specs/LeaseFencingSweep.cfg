\* Configuration-family check: Init chooses every timing combination from
\* these ranges that LeaseTiming::new would validate (TimingOK filters the
\* rest, exactly as the constructor refuses to build them). A pass means the
\* validator's inequalities -- not the specific numbers -- carry the
\* ChunkExclusion theorem, within these bounds. Expect: no violations.
CONSTANTS
  Workers = {w1, w2}
  NoOwner = NoOwner
  LeaseDurations = {4, 5, 6, 7}
  GraphChunkDeadlines = {1, 2}
  CursorCommitDeadlines = {1, 2}
  SafetyMargins = {1, 2}
  ClockSkew = 1
  ActualSkewBound = 1
  MaxTime = 9
  MaxVer = 4
  ChunkSlots = 2
INIT Init
NEXT Next
INVARIANTS TypeOK ChunkExclusion
CONSTRAINT StateBound
SYMMETRY Sym
CHECK_DEADLOCK FALSE
