connector:
  # Distinct from the real extract pipeline's "sap": entity UUIDs are namespaced
  # by connector id, so mock seeds can never collide with real SAP data in a web.
  id: sap-mock
  mode: batch
  provenance:
    location:
      name: SAP Mock Data (synthetic)

# SITE scopes the material tier + purchase/production orders; MOVEMENT_SITES scopes the flow tier
# (movements, deliveries, shipments, sales), which also requires the material to be a SITE material.
# The generator uses a hub-and-spoke plant layout (1000 hub, 2000-5000 spokes).
vars:
  SITE: "1000"
  MOVEMENT_SITES: "'1000','2000','3000','4000','5000'"
  # Earliest record date to ingest; set low so the full synthetic set is kept.
  DATE_CUTOFF: "2000-01-01"

