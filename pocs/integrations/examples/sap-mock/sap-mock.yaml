          sql: SELECT src.* FROM src JOIN target ON src."MATNR" = target."MATNR"
      from: { entityType: "https://hash.ai/@h/types/entity-type/material-reservation/v/1", column: _sap_id }
      to: { entityType: "https://hash.ai/@h/types/entity-type/material/v/1", column: MATNR }
