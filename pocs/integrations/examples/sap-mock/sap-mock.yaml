          sql: SELECT bom._sap_id AS _bom_id, src."MATNR" FROM src JOIN bom ON src."STLNR" = bom."STLNR" AND src."STLAL" = bom."STLAL" JOIN target ON src."MATNR" = target."MATNR"
      from: { entityType: "https://hash.ai/@h/types/entity-type/bill-of-materials/v/1", column: _bom_id }
      to: { entityType: "https://hash.ai/@h/types/entity-type/material/v/1", column: MATNR }
      linkType: "https://hash.ai/@h/types/entity-type/has-material/v/1"

    # STPO has no STLAL, so BOM->item joins on (STLTY, STLNR) -- fine for single-alternative BOMs.
    - id: stko-has-line-item
      inputs:
        bom: sap/stko
