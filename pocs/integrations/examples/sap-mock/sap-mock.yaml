    - id: vttp-belongs-to-shipment
      inputs:
        src: sap/vttp
        target: sap/vttk
      steps:
        - id: vttp-tknum-filter
          kind: sql
          sql: SELECT src.* FROM src JOIN target ON src."TKNUM" = target."TKNUM"
      from: { entityType: "https://hash.ai/@h/types/entity-type/shipment/v/1", column: TKNUM }
      to: { entityType: "https://hash.ai/@h/types/entity-type/shipment-item/v/1", column: _sap_id }
      linkType: "https://hash.ai/@h/types/entity-type/has-line-item/v/1"

    - id: vttp-vbeln-transports-delivery
      inputs:
        src: sap/vttp
        target: sap/likp
      steps:
        - id: vttp-vbeln-filter
          kind: sql
          sql: SELECT src._sap_id, target."VBELN" AS _target_vbeln FROM src JOIN target ON src."VBELN" = target."VBELN"
      from: { entityType: "https://hash.ai/@h/types/entity-type/shipment-item/v/1", column: _sap_id }
      to: { entityType: "https://hash.ai/@h/types/entity-type/delivery/v/1", column: _target_vbeln }
      linkType: "https://hash.ai/@h/types/entity-type/transports/v/1"

    - id: ekpo-werks-located-at-site
      inputs:
        src: sap/ekpo
        target: sap/t001w
      steps:
        - id: ekpo-werks-filter
          kind: sql
          sql: SELECT src._sap_id, target."WERKS" AS _target_werks FROM src JOIN target ON TRIM(src."WERKS") = target."WERKS"
      from: { entityType: "https://hash.ai/@h/types/entity-type/purchase-order-item/v/1", column: _sap_id }
      to: { entityType: "${HASH_TYPE_BASE}/entity-type/site/v/1", column: _target_werks }
      linkType: "${HASH_TYPE_BASE}/entity-type/located-at/v/1"

    - id: afpo-dwerk-located-at-site
      inputs:
        src: sap/afpo
        target: sap/t001w
      steps:
        - id: afpo-dwerk-filter
          kind: sql
          sql: SELECT src._sap_id, target."WERKS" AS _target_werks FROM src JOIN target ON TRIM(src."DWERK") = target."WERKS"
      from: { entityType: "https://hash.ai/@h/types/entity-type/production-order-item/v/1", column: _sap_id }
      to: { entityType: "${HASH_TYPE_BASE}/entity-type/site/v/1", column: _target_werks }
      linkType: "${HASH_TYPE_BASE}/entity-type/located-at/v/1"

    - id: matdoc-werks-located-at-site
      inputs:
        src: sap/matdoc
        target: sap/t001w
      steps:
        - id: matdoc-werks-filter
          kind: sql
          sql: SELECT src._sap_id, target."WERKS" AS _target_werks FROM src JOIN target ON TRIM(src."WERKS") = target."WERKS"
      from: { entityType: "https://hash.ai/@h/types/entity-type/material-document/v/1", column: _sap_id }
      to: { entityType: "${HASH_TYPE_BASE}/entity-type/site/v/1", column: _target_werks }
      linkType: "${HASH_TYPE_BASE}/entity-type/located-at/v/1"

    - id: lips-werks-located-at-site
      inputs:
        src: sap/lips
        target: sap/t001w
      steps:
        - id: lips-werks-filter
          kind: sql
          sql: SELECT src._sap_id, target."WERKS" AS _target_werks FROM src JOIN target ON TRIM(src."WERKS") = target."WERKS"
      from: { entityType: "https://hash.ai/@h/types/entity-type/delivery-item/v/1", column: _sap_id }
      to: { entityType: "${HASH_TYPE_BASE}/entity-type/site/v/1", column: _target_werks }
      linkType: "${HASH_TYPE_BASE}/entity-type/located-at/v/1"

    - id: resb-werks-located-at-site
      inputs:
        src: sap/resb
        target: sap/t001w
      steps:
        - id: resb-werks-filter
          kind: sql
          sql: SELECT src._sap_id, target."WERKS" AS _target_werks FROM src JOIN target ON TRIM(src."WERKS") = target."WERKS"
      from: { entityType: "https://hash.ai/@h/types/entity-type/material-reservation/v/1", column: _sap_id }
      to: { entityType: "${HASH_TYPE_BASE}/entity-type/site/v/1", column: _target_werks }
      linkType: "${HASH_TYPE_BASE}/entity-type/located-at/v/1"

    - id: marc-werks-located-at-site
      inputs:
        src: sap/marc
        target: sap/t001w
      steps:
        - id: marc-werks-filter
          kind: sql
          sql: SELECT src._sap_id, target."WERKS" AS _target_werks FROM src JOIN target ON TRIM(src."WERKS") = target."WERKS"
      from: { entityType: "https://hash.ai/@h/types/entity-type/site-material-data/v/1", column: _sap_id }
      to: { entityType: "${HASH_TYPE_BASE}/entity-type/site/v/1", column: _target_werks }
      linkType: "${HASH_TYPE_BASE}/entity-type/located-at/v/1"

    - id: vbap-werks-located-at-site
      inputs:
        src: sap/vbap
        target: sap/t001w
      steps:
        - id: vbap-werks-filter
          kind: sql
          sql: SELECT src._sap_id, target."WERKS" AS _target_werks FROM src JOIN target ON TRIM(src."WERKS") = target."WERKS"
      from: { entityType: "https://hash.ai/@h/types/entity-type/sales-order-item/v/1", column: _sap_id }
      to: { entityType: "${HASH_TYPE_BASE}/entity-type/site/v/1", column: _target_werks }
      linkType: "${HASH_TYPE_BASE}/entity-type/located-at/v/1"

    - id: mcha-of-material
      inputs:
        src: sap/batch_pairs
        target: sap/makt
      steps:
        - id: mcha-of-material-filter
          kind: sql
          sql: >
            SELECT DISTINCT ON (src."CHARG", target."MATNR")
              src."CHARG" AS _src_charg, target."MATNR" AS _target_matnr, src."VFDAT"
            FROM src JOIN target ON src."MATNR" = target."MATNR"
            ORDER BY src."CHARG", target."MATNR"
      from: { entityType: "${HASH_TYPE_BASE}/entity-type/batch/v/1", column: _src_charg }
      to: { entityType: "https://hash.ai/@h/types/entity-type/material/v/1", column: _target_matnr }
      linkType: "${HASH_TYPE_BASE}/entity-type/of-material/v/1"
      properties:
        "${HASH_TYPE_BASE}/property-type/expiry-date/v/1": { column: VFDAT, coerce: date }

    - id: mcha-stored-at
      inputs:
        src: sap/batch_stock
        target: sap/t001w
      steps:
        - id: mcha-stored-at-filter
          kind: sql
          sql: >
            SELECT src."CHARG" AS _src_charg, target."WERKS" AS _target_werks,
              SUM(src."CLABS") AS "CLABS", SUM(src."CINSM") AS "CINSM",
              SUM(src."CEINM") AS "CEINM", SUM(src."CSPEM") AS "CSPEM",
              ANY_VALUE(src."MEINS") AS "MEINS"
            FROM src JOIN target ON TRIM(src."WERKS") = target."WERKS"
            GROUP BY src."CHARG", target."WERKS"
      from: { entityType: "${HASH_TYPE_BASE}/entity-type/batch/v/1", column: _src_charg }
      to: { entityType: "${HASH_TYPE_BASE}/entity-type/site/v/1", column: _target_werks }
      linkType: "${HASH_TYPE_BASE}/entity-type/stored-at/v/1"
      properties:
        "${HASH_TYPE_BASE}/property-type/stock-quantity/v/1": { amount: CLABS, unit: MEINS, measure: quantity }
        "${HASH_TYPE_BASE}/property-type/quality-inspection-stock/v/1": { amount: CINSM, unit: MEINS, measure: quantity }
        "${HASH_TYPE_BASE}/property-type/restricted-use-stock/v/1": { amount: CEINM, unit: MEINS, measure: quantity }
        "${HASH_TYPE_BASE}/property-type/blocked-stock/v/1": { amount: CSPEM, unit: MEINS, measure: quantity }

    - id: matdoc-records-batch
      inputs:
        src: sap/matdoc
        target: sap/batch
      steps:
        - id: matdoc-records-batch-filter
          kind: sql
          sql: >
            SELECT src._sap_id, target."_sap_id" AS _target_id
            FROM src JOIN target ON TRIM(src."CHARG") = target."_sap_id"
            WHERE TRIM(src."CHARG") <> ''
      from: { entityType: "https://hash.ai/@h/types/entity-type/material-document/v/1", column: _sap_id }
      to: { entityType: "${HASH_TYPE_BASE}/entity-type/batch/v/1", column: _target_id }
      linkType: "${HASH_TYPE_BASE}/entity-type/records/v/1"

    - id: lips-delivers-batch
      inputs:
        src: sap/lips
        target: sap/batch
      steps:
        - id: lips-delivers-batch-filter
          kind: sql
          sql: >
            SELECT src._sap_id, target."_sap_id" AS _target_id
            FROM src JOIN target ON TRIM(src."CHARG") = target."_sap_id"
            WHERE TRIM(src."CHARG") <> ''
      from: { entityType: "https://hash.ai/@h/types/entity-type/delivery-item/v/1", column: _sap_id }
      to: { entityType: "${HASH_TYPE_BASE}/entity-type/batch/v/1", column: _target_id }
      linkType: "${HASH_TYPE_BASE}/entity-type/delivers/v/1"

    - id: afko-yields-batch
      inputs:
        src: sap/matdoc
        target: sap/batch
        prod: sap/afko
      steps:
        - id: afko-yields-batch-filter
          kind: sql
          sql: >
            SELECT DISTINCT src."AUFNR", target."_sap_id" AS _target_id
            FROM src
            JOIN target ON TRIM(src."CHARG") = target."_sap_id"
            JOIN prod ON src."AUFNR" = prod."AUFNR"
            WHERE TRIM(src."BWART") = '101' AND TRIM(src."AUFNR") <> '' AND TRIM(src."CHARG") <> ''
      from: { entityType: "https://hash.ai/@h/types/entity-type/production-order/v/1", column: AUFNR }
      to: { entityType: "${HASH_TYPE_BASE}/entity-type/batch/v/1", column: _target_id }
      linkType: "${HASH_TYPE_BASE}/entity-type/yields/v/1"

orchestration:
  maxRetries: 2
  retryIntervalSeconds: 30
