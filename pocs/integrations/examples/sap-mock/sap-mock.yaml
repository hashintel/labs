sources:
  # SAP Mock Data generator writes one Delta table per SAP table (UPPERCASE SAP
  # technical column names). SOURCE_FOLDER is a directory of Delta tables, one
  # subdir per table (each with a _delta_log/); each source loads the `delta`
  # extension and reads via delta_scan. The COLUMNS(*)::VARCHAR wrap coerces
  # every column to text (Delta preserves real types) so the shared normalisation
  # holds: dates arrive as YYYYMMDD strings and are converted to ISO here so
  # `coerce: date` and the cutoff filters work. Output columns match
  # supply-chain.yaml one-for-one, so the entire pipelines/links block downstream
  # is reused unchanged; columns the generator does not produce are emitted NULL.

  makt:
    kind: sql
    extensions: [delta]
    primaryKey: MATNR
    sql: |
      SELECT
        REGEXP_REPLACE(TRIM(k."MATNR"), '^0+(.)', '\1') AS "MATNR",
        k."MAKTX", k."SPRAS",
        a."MTART", a."MATKL", a."MEINS", CAST(NULL AS VARCHAR) AS "MSTAE"
      FROM (SELECT COLUMNS(*)::VARCHAR FROM delta_scan('${SOURCE_FOLDER}/makt')) k
      LEFT JOIN (
        SELECT DISTINCT ON (REGEXP_REPLACE(TRIM("MATNR"), '^0+(.)', '\1'))
          REGEXP_REPLACE(TRIM("MATNR"), '^0+(.)', '\1') AS "MATNR",
          TRIM("MTART") AS "MTART", TRIM("MATKL") AS "MATKL", TRIM("MEINS") AS "MEINS"
        FROM (SELECT COLUMNS(*)::VARCHAR FROM delta_scan('${SOURCE_FOLDER}/mara'))
      ) a ON a."MATNR" = REGEXP_REPLACE(TRIM(k."MATNR"), '^0+(.)', '\1')
      WHERE k."MATNR" IS NOT NULL AND TRIM(k."MATNR") <> ''

  kna1:
    kind: sql
    extensions: [delta]
    primaryKey: KUNNR
    sql: |
      SELECT
        "KUNNR", "NAME1", "ORT01", "PSTLZ", "LAND1",
        CAST(NULL AS VARCHAR) AS "STRAS", CAST(NULL AS VARCHAR) AS "REGIO", CAST(NULL AS VARCHAR) AS "BRSCH",
        CASE WHEN regexp_matches(TRIM("ERDAT"), '^[0-9]{8}$')
          THEN SUBSTR(TRIM("ERDAT"),1,4)||'-'||SUBSTR(TRIM("ERDAT"),5,2)||'-'||SUBSTR(TRIM("ERDAT"),7,2)
          ELSE NULLIF(TRIM("ERDAT"),'') END AS "ERDAT"
      FROM (SELECT COLUMNS(*)::VARCHAR FROM delta_scan('${SOURCE_FOLDER}/kna1'))
      WHERE "KUNNR" IS NOT NULL AND TRIM("KUNNR") <> ''

  vbak:
    kind: sql
    extensions: [delta]
    primaryKey: VBELN
    sql: |
      SELECT
        "VBELN", "AUART", CAST(NULL AS VARCHAR) AS "VKORG", CAST(NULL AS VARCHAR) AS "VTWEG", CAST(NULL AS VARCHAR) AS "SPART",
        CAST(NULL AS VARCHAR) AS "BSTNK", "KUNNR",
        CASE WHEN regexp_matches(TRIM("ERDAT"), '^[0-9]{8}$')
          THEN SUBSTR(TRIM("ERDAT"),1,4)||'-'||SUBSTR(TRIM("ERDAT"),5,2)||'-'||SUBSTR(TRIM("ERDAT"),7,2)
          ELSE NULLIF(TRIM("ERDAT"),'') END AS "AUDAT",
        CASE WHEN regexp_matches(TRIM("VDATU"), '^[0-9]{8}$')
          THEN SUBSTR(TRIM("VDATU"),1,4)||'-'||SUBSTR(TRIM("VDATU"),5,2)||'-'||SUBSTR(TRIM("VDATU"),7,2)
          ELSE NULLIF(TRIM("VDATU"),'') END AS "VDATU",
        CASE WHEN regexp_matches(TRIM("ERDAT"), '^[0-9]{8}$')
          THEN SUBSTR(TRIM("ERDAT"),1,4)||'-'||SUBSTR(TRIM("ERDAT"),5,2)||'-'||SUBSTR(TRIM("ERDAT"),7,2)
          ELSE NULLIF(TRIM("ERDAT"),'') END AS "ERDAT",
        CAST(NULL AS VARCHAR) AS "ERNAM", "WAERK"
      FROM (SELECT COLUMNS(*)::VARCHAR FROM delta_scan('${SOURCE_FOLDER}/vbak'))
      WHERE "VBELN" IS NOT NULL AND TRIM("VBELN") <> ''
        AND TRY_CAST(try_strptime(TRIM("ERDAT"), '%Y%m%d') AS DATE) >= DATE '${DATE_CUTOFF}'

  marc:
    kind: sql
    extensions: [delta]
    primaryKey: [MATNR, WERKS]
    sql: |
      SELECT
        c."MATNR", c."WERKS", a."MEINS",
        CAST(NULL AS VARCHAR) AS "PLIFZ", CAST(NULL AS VARCHAR) AS "WEBAZ", CAST(NULL AS VARCHAR) AS "DZEIT", CAST(NULL AS VARCHAR) AS "DISMM",
        c."BESKZ", c."DISPO", CAST(NULL AS VARCHAR) AS "DISLS", CAST(NULL AS VARCHAR) AS "MMSTA", c."EISBE",
        c."BSTMI", c."BSTMA", c."BSTFE", c."BSTRF"
      FROM (SELECT COLUMNS(*)::VARCHAR FROM delta_scan('${SOURCE_FOLDER}/marc')) c
      LEFT JOIN (
        SELECT DISTINCT ON (REGEXP_REPLACE(TRIM("MATNR"), '^0+(.)', '\1'))
          REGEXP_REPLACE(TRIM("MATNR"), '^0+(.)', '\1') AS "MATNR", TRIM("MEINS") AS "MEINS"
        FROM (SELECT COLUMNS(*)::VARCHAR FROM delta_scan('${SOURCE_FOLDER}/mara'))
      ) a ON a."MATNR" = REGEXP_REPLACE(TRIM(c."MATNR"), '^0+(.)', '\1')
      WHERE c."MATNR" IS NOT NULL AND TRIM(c."MATNR") <> ''
        AND TRIM(c."WERKS") = '${SITE}'

  # SITE material allowlist: normalised MATNR mastered at the plant.
  site_materials:
    kind: sql
    extensions: [delta]
    primaryKey: MATNR
    sql: |
      SELECT DISTINCT REGEXP_REPLACE(TRIM("MATNR"), '^0+(.)', '\1') AS "MATNR"
      FROM (SELECT COLUMNS(*)::VARCHAR FROM delta_scan('${SOURCE_FOLDER}/marc'))
      WHERE "MATNR" IS NOT NULL AND TRIM("MATNR") <> ''
        AND TRIM("WERKS") = '${SITE}'

  mbew:
    kind: sql
    extensions: [delta]
    primaryKey: [MATNR, BWKEY, BWTAR]
    sql: |
      SELECT
        "MATNR", "BWKEY", '' AS "BWTAR",
        "BKLAS", "VPRSV", "STPRS", "VERPR", "PEINH"
      FROM (SELECT COLUMNS(*)::VARCHAR FROM delta_scan('${SOURCE_FOLDER}/mbew'))
      WHERE "MATNR" IS NOT NULL AND TRIM("MATNR") <> ''

  likp:
    kind: sql
    extensions: [delta]
    primaryKey: VBELN
    sql: |
      SELECT
        "VBELN", "LFART",
        CASE WHEN regexp_matches(TRIM("LFDAT"), '^[0-9]{8}$')
          THEN SUBSTR(TRIM("LFDAT"),1,4)||'-'||SUBSTR(TRIM("LFDAT"),5,2)||'-'||SUBSTR(TRIM("LFDAT"),7,2)
          ELSE NULLIF(TRIM("LFDAT"),'') END AS "LFDAT",
        CAST(NULL AS VARCHAR) AS "WADAT", CAST(NULL AS VARCHAR) AS "WADAT_IST", "KUNNR", CAST(NULL AS VARCHAR) AS "VSTEL", CAST(NULL AS VARCHAR) AS "INCO1",
        CASE WHEN regexp_matches(TRIM("LFDAT"), '^[0-9]{8}$')
          THEN SUBSTR(TRIM("LFDAT"),1,4)||'-'||SUBSTR(TRIM("LFDAT"),5,2)||'-'||SUBSTR(TRIM("LFDAT"),7,2)
          ELSE NULLIF(TRIM("LFDAT"),'') END AS "ERDAT",
        CAST(NULL AS VARCHAR) AS "ERNAM"
      FROM (SELECT COLUMNS(*)::VARCHAR FROM delta_scan('${SOURCE_FOLDER}/likp'))
      WHERE "VBELN" IS NOT NULL AND TRIM("VBELN") <> ''
        AND TRY_CAST(try_strptime(TRIM("LFDAT"), '%Y%m%d') AS DATE) >= DATE '${DATE_CUTOFF}'

  vbap:
    kind: sql
    extensions: [delta]
    primaryKey: [VBELN, POSNR]
    sql: |
      SELECT
        "VBELN", "POSNR", "MATNR", "WERKS",
        CAST(NULL AS VARCHAR) AS "PSTYV", CAST(NULL AS VARCHAR) AS "ABGRU", "KWMENG", "MEINS" AS "VRKME"
      FROM (SELECT COLUMNS(*)::VARCHAR FROM delta_scan('${SOURCE_FOLDER}/vbap'))
      WHERE "VBELN" IS NOT NULL AND TRIM("VBELN") <> ''
        AND TRIM("WERKS") IN (${MOVEMENT_SITES})

  vbap_keys:
    kind: sql
    extensions: [delta]
    primaryKey: VBELN
    sql: |
      SELECT DISTINCT REGEXP_REPLACE(TRIM("VBELN"), '^0+(.)', '\1') AS "VBELN"
      FROM (SELECT COLUMNS(*)::VARCHAR FROM delta_scan('${SOURCE_FOLDER}/vbap'))
      WHERE "VBELN" IS NOT NULL AND TRIM("VBELN") <> ''
        AND TRIM("WERKS") IN (${MOVEMENT_SITES})
        AND REGEXP_REPLACE(TRIM("MATNR"), '^0+(.)', '\1') IN (
          SELECT DISTINCT REGEXP_REPLACE(TRIM("MATNR"), '^0+(.)', '\1')
          FROM (SELECT COLUMNS(*)::VARCHAR FROM delta_scan('${SOURCE_FOLDER}/marc'))
          WHERE TRIM("WERKS") = '${SITE}')

  lips:
    kind: sql
    extensions: [delta]
    primaryKey: [VBELN, POSNR]
    sql: |
      SELECT
        p."VBELN", p."POSNR", p."MATNR", p."WERKS",
        CAST(NULL AS VARCHAR) AS "CHARG", CAST(NULL AS VARCHAR) AS "LGORT", p."LFIMG", CAST(NULL AS VARCHAR) AS "VRKME",
        f."VBELN" AS "VGBEL", f."POSNN" AS "VGPOS", CAST(NULL AS VARCHAR) AS "MATKL",
        CAST(NULL AS VARCHAR) AS "ERDAT", CAST(NULL AS VARCHAR) AS "ERNAM"
      FROM (SELECT COLUMNS(*)::VARCHAR FROM delta_scan('${SOURCE_FOLDER}/lips')) p
      LEFT JOIN (
        SELECT DISTINCT ON (TRIM("VBELN_N"), TRIM("POSNN_N"))
          TRIM("VBELN_N") AS "VBELN_N", TRIM("POSNN_N") AS "POSNN_N",
          TRIM("VBELN") AS "VBELN", TRIM("POSNN") AS "POSNN"
        FROM (SELECT COLUMNS(*)::VARCHAR FROM delta_scan('${SOURCE_FOLDER}/vbfa'))
        WHERE TRIM("VBTYP_N") = 'J'
      ) f ON TRIM(p."VBELN") = f."VBELN_N" AND TRIM(p."POSNR") = f."POSNN_N"
      WHERE p."VBELN" IS NOT NULL AND TRIM(p."VBELN") <> ''
        AND TRIM(p."WERKS") IN (${MOVEMENT_SITES})

  lips_keys:
    kind: sql
    extensions: [delta]
    primaryKey: VBELN
    sql: |
      SELECT DISTINCT REGEXP_REPLACE(TRIM("VBELN"), '^0+(.)', '\1') AS "VBELN"
      FROM (SELECT COLUMNS(*)::VARCHAR FROM delta_scan('${SOURCE_FOLDER}/lips'))
      WHERE "VBELN" IS NOT NULL AND TRIM("VBELN") <> ''
        AND TRIM("WERKS") IN (${MOVEMENT_SITES})
        AND REGEXP_REPLACE(TRIM("MATNR"), '^0+(.)', '\1') IN (
          SELECT DISTINCT REGEXP_REPLACE(TRIM("MATNR"), '^0+(.)', '\1')
          FROM (SELECT COLUMNS(*)::VARCHAR FROM delta_scan('${SOURCE_FOLDER}/marc'))
          WHERE TRIM("WERKS") = '${SITE}')

  lfa1:
    kind: sql
    extensions: [delta]
    primaryKey: LIFNR
    sql: |
      SELECT "LIFNR", "NAME1"
      FROM (SELECT COLUMNS(*)::VARCHAR FROM delta_scan('${SOURCE_FOLDER}/lfa1'))
      WHERE "LIFNR" IS NOT NULL AND TRIM("LIFNR") <> ''
        AND COALESCE(TRIM("LOEVM"), '') <> 'X'

  # AFPO is not emitted by the generator; the production-order-item tier is
  # synthesised from AFKO (one item per order): PLNBEZ->MATNR, GAMNG->PSMNG,
  # IGMNG->WEMNG. Kept as its own source so the downstream item pipeline/links
  # are unchanged.
  afko:
    kind: sql
    extensions: [delta]
    primaryKey: AUFNR
    sql: |
      SELECT
        "AUFNR",
        CASE WHEN regexp_matches(TRIM("GSTRP"), '^[0-9]{8}$')
          THEN SUBSTR(TRIM("GSTRP"),1,4)||'-'||SUBSTR(TRIM("GSTRP"),5,2)||'-'||SUBSTR(TRIM("GSTRP"),7,2)
          ELSE NULLIF(TRIM("GSTRP"),'') END AS "GSTRS",
        CAST(NULL AS VARCHAR) AS "GETRI", CAST(NULL AS VARCHAR) AS "FTRMP", CAST(NULL AS VARCHAR) AS "GSTRI", CAST(NULL AS VARCHAR) AS "STLAL"
      FROM (SELECT COLUMNS(*)::VARCHAR FROM delta_scan('${SOURCE_FOLDER}/afko'))
      WHERE "AUFNR" IS NOT NULL AND TRIM("AUFNR") <> ''
        AND (COALESCE(TRIM("GSTRP"), '') = ''
             OR TRY_CAST(try_strptime(TRIM("GSTRP"), '%Y%m%d') AS DATE) >= DATE '${DATE_CUTOFF}')

  afpo:
    kind: sql
    extensions: [delta]
    primaryKey: [AUFNR, POSNR]
    sql: |
      SELECT
        "AUFNR", '0001' AS "POSNR", "PLNBEZ" AS "MATNR",
        "WERKS" AS "DWERK", "GAMNG" AS "PSMNG", "IGMNG" AS "WEMNG", 'PC' AS "MEINS"
      FROM (SELECT COLUMNS(*)::VARCHAR FROM delta_scan('${SOURCE_FOLDER}/afko'))
      WHERE "AUFNR" IS NOT NULL AND TRIM("AUFNR") <> ''
        AND TRIM("WERKS") = '${SITE}'

  afpo_keys:
    kind: sql
    extensions: [delta]
    primaryKey: AUFNR
    sql: |
      SELECT DISTINCT REGEXP_REPLACE(TRIM("AUFNR"), '^0+(.)', '\1') AS "AUFNR"
      FROM (SELECT COLUMNS(*)::VARCHAR FROM delta_scan('${SOURCE_FOLDER}/afko'))
      WHERE "AUFNR" IS NOT NULL AND TRIM("AUFNR") <> ''
        AND TRIM("WERKS") = '${SITE}'

  ekko:
    kind: sql
    extensions: [delta]
    primaryKey: EBELN
    sql: |
      SELECT
        "EBELN",
        CASE WHEN regexp_matches(TRIM("BEDAT"), '^[0-9]{8}$')
          THEN SUBSTR(TRIM("BEDAT"),1,4)||'-'||SUBSTR(TRIM("BEDAT"),5,2)||'-'||SUBSTR(TRIM("BEDAT"),7,2)
          ELSE NULLIF(TRIM("BEDAT"),'') END AS "BEDAT",
        CASE WHEN regexp_matches(TRIM("AEDAT"), '^[0-9]{8}$')
          THEN SUBSTR(TRIM("AEDAT"),1,4)||'-'||SUBSTR(TRIM("AEDAT"),5,2)||'-'||SUBSTR(TRIM("AEDAT"),7,2)
          ELSE NULLIF(TRIM("AEDAT"),'') END AS "AEDAT",
        "LIFNR", "BSART", "EKORG", "EKGRP", "WAERS" AS "WAERK"
      FROM (SELECT COLUMNS(*)::VARCHAR FROM delta_scan('${SOURCE_FOLDER}/ekko'))
      WHERE "EBELN" IS NOT NULL AND TRIM("EBELN") <> ''
        AND TRY_CAST(try_strptime(TRIM("BEDAT"), '%Y%m%d') AS DATE) >= DATE '${DATE_CUTOFF}'

  ekpo:
    kind: sql
    extensions: [delta]
    primaryKey: [EBELN, EBELP]
    sql: |
      SELECT
        "EBELN", "EBELP", "MATNR", "WERKS", "LOEKZ", "MENGE", "MEINS"
      FROM (SELECT COLUMNS(*)::VARCHAR FROM delta_scan('${SOURCE_FOLDER}/ekpo'))
      WHERE "EBELN" IS NOT NULL AND TRIM("EBELN") <> ''
        AND COALESCE(TRIM("LOEKZ"), '') <> 'L'
        AND TRIM("WERKS") = '${SITE}'

  ekpo_keys:
    kind: sql
    extensions: [delta]
    primaryKey: EBELN
    sql: |
      SELECT DISTINCT REGEXP_REPLACE(TRIM("EBELN"), '^0+(.)', '\1') AS "EBELN"
      FROM (SELECT COLUMNS(*)::VARCHAR FROM delta_scan('${SOURCE_FOLDER}/ekpo'))
      WHERE "EBELN" IS NOT NULL AND TRIM("EBELN") <> ''
        AND COALESCE(TRIM("LOEKZ"), '') <> 'L'
        AND TRIM("WERKS") = '${SITE}'

  # The generator emits the S/4 universal MATDOC directly (no MKPF+MSEG split).
  # MENGE is already the signed-magnitude quantity; SHKZG carries direction
  # (S=debit/increase, H=credit/decrease). EBELN/EBELP/RSNUM/LIFNR are not on
  # MATDOC, so PO- and reservation-anchored movement joins are absent; AUFNR
  # (production) and CHARG (batch) are present and drive those links.
  matdoc:
    kind: sql
    extensions: [delta]
    primaryKey: [MBLNR, MJAHR, BUDAT, ZEILE, SHKZG]
    sql: |
      SELECT
        "MBLNR", "MJAHR", "MATNR", "WERKS", "LGORT", "CHARG", "BWART",
        CAST(NULL AS VARCHAR) AS "LIFNR", "KUNNR", CAST(NULL AS VARCHAR) AS "EBELN", CAST(NULL AS VARCHAR) AS "EBELP", "AUFNR",
        "SHKZG", "MEINS", CAST(NULL AS VARCHAR) AS "RSNUM",
        CASE WHEN regexp_matches(TRIM("BUDAT"), '^[0-9]{8}$')
          THEN SUBSTR(TRIM("BUDAT"),1,4)||'-'||SUBSTR(TRIM("BUDAT"),5,2)||'-'||SUBSTR(TRIM("BUDAT"),7,2)
          ELSE NULLIF(TRIM("BUDAT"),'') END AS "BUDAT",
        "XBLNR" AS "SMBLN", "ZEILE",
        CASE
          WHEN TRIM("BWART") LIKE '3%' OR TRIM("BWART") IN ('641', '642', '647') THEN 'Transfer'
          WHEN TRIM("SHKZG") = 'S' THEN 'Goods Receipt'
          ELSE 'Goods Issue'
        END AS "MVT_CATEGORY",
        CASE WHEN TRIM("SHKZG") = 'S' THEN 'Increase' ELSE 'Decrease' END AS "MVT_DIRECTION",
        ABS(COALESCE(TRY_CAST("MENGE" AS DOUBLE), 0)) AS "MENGE"
      FROM (SELECT COLUMNS(*)::VARCHAR FROM delta_scan('${SOURCE_FOLDER}/matdoc'))
      WHERE "MBLNR" IS NOT NULL AND TRIM("MBLNR") <> ''
        AND COALESCE(TRIM("BWART"), '') <> ''
        AND TRY_CAST(try_strptime(TRIM("BUDAT"), '%Y%m%d') AS DATE) >= DATE '${DATE_CUTOFF}'
        AND TRIM("WERKS") IN (${MOVEMENT_SITES})

  mast:
    kind: sql
    extensions: [delta]
    primaryKey: [MATNR, WERKS, STLAN]
    sql: |
      SELECT DISTINCT
        "MATNR", "WERKS", "STLAN", "STLNR", "STLAL"
      FROM (SELECT COLUMNS(*)::VARCHAR FROM delta_scan('${SOURCE_FOLDER}/mast'))
      WHERE "MATNR" IS NOT NULL AND TRIM("MATNR") <> ''
        AND TRIM("WERKS") = '${SITE}'

  stko:
    kind: sql
    extensions: [delta]
    primaryKey: [STLNR, STLAL]
    sql: |
      SELECT DISTINCT "STLTY", "STLNR", "STLAL", CAST(NULL AS VARCHAR) AS "LKENZ",
        "BMENG", "BMEIN"
      FROM (SELECT COLUMNS(*)::VARCHAR FROM delta_scan('${SOURCE_FOLDER}/stko'))
      WHERE "STLNR" IS NOT NULL AND TRIM("STLNR") <> ''

  stpo:
    kind: sql
    extensions: [delta]
    primaryKey: [STLTY, STLNR, STLKN]
    sql: |
      SELECT
        "STLTY", "STLNR", "STLKN", "IDNRK",
        "STLKN" AS "POSNR", "MENGE", "MEINS", CAST(NULL AS VARCHAR) AS "AUSCH",
        "STLAL", CAST(NULL AS VARCHAR) AS "POSTP", CAST(NULL AS VARCHAR) AS "FMENG"
      FROM (SELECT COLUMNS(*)::VARCHAR FROM delta_scan('${SOURCE_FOLDER}/stpo'))
      WHERE "STLNR" IS NOT NULL AND TRIM("STLNR") <> ''

  resb:
    kind: sql
    extensions: [delta]
    primaryKey: [RSNUM, RSPOS]
    sql: |
      SELECT
        "RSNUM", "RSPOS", "MATNR", "WERKS",
        "BDMNG", 'PC' AS "MEINS", 'H' AS "SHKZG",
        'Decrease' AS "MVT_DIRECTION",
        "ENMNG", "RSNUM" AS "AUFNR"
      FROM (SELECT COLUMNS(*)::VARCHAR FROM delta_scan('${SOURCE_FOLDER}/resb'))
      WHERE "RSNUM" IS NOT NULL AND TRIM("RSNUM") <> ''

  vttk:
    kind: sql
    extensions: [delta]
    primaryKey: TKNUM
    sql: |
      SELECT
        REGEXP_REPLACE(TRIM("TKNUM"), '^0+(.)', '\1') AS "TKNUM",
        "ROUTE",
        CASE WHEN regexp_matches(TRIM("DTTRG"), '^[0-9]{8}$')
          THEN SUBSTR(TRIM("DTTRG"),1,4)||'-'||SUBSTR(TRIM("DTTRG"),5,2)||'-'||SUBSTR(TRIM("DTTRG"),7,2)
          ELSE NULLIF(TRIM("DTTRG"),'') END AS "DATBG",
        CASE WHEN regexp_matches(TRIM("DTDIS"), '^[0-9]{8}$')
          THEN SUBSTR(TRIM("DTDIS"),1,4)||'-'||SUBSTR(TRIM("DTDIS"),5,2)||'-'||SUBSTR(TRIM("DTDIS"),7,2)
          ELSE NULLIF(TRIM("DTDIS"),'') END AS "DTABF",
        CAST(NULL AS VARCHAR) AS "DATEN", CAST(NULL AS VARCHAR) AS "DPTEN", CAST(NULL AS VARCHAR) AS "ERNAM",
        CASE WHEN regexp_matches(TRIM("ERDAT"), '^[0-9]{8}$')
          THEN SUBSTR(TRIM("ERDAT"),1,4)||'-'||SUBSTR(TRIM("ERDAT"),5,2)||'-'||SUBSTR(TRIM("ERDAT"),7,2)
          ELSE NULLIF(TRIM("ERDAT"),'') END AS "ERDAT"
      FROM (SELECT COLUMNS(*)::VARCHAR FROM delta_scan('${SOURCE_FOLDER}/vttk'))
      WHERE "TKNUM" IS NOT NULL AND TRIM("TKNUM") <> ''

  vttp:
    kind: sql
    extensions: [delta]
    primaryKey: [TKNUM, TPNUM]
    sql: |
      SELECT
        REGEXP_REPLACE(TRIM("TKNUM"), '^0+(.)', '\1') AS "TKNUM",
        "TPNUM",
        REGEXP_REPLACE(TRIM("VBELN"), '^0+(.)', '\1') AS "VBELN"
      FROM (SELECT COLUMNS(*)::VARCHAR FROM delta_scan('${SOURCE_FOLDER}/vttp'))
      WHERE "TKNUM" IS NOT NULL AND TRIM("TKNUM") <> ''

  t001w:
    kind: sql
    extensions: [delta]
    primaryKey: WERKS
    sql: |
      SELECT
        TRIM("WERKS") AS "WERKS", TRIM("NAME1") AS "NAME1", TRIM("STRAS") AS "STRAS",
        TRIM("ORT01") AS "ORT01", TRIM("REGIO") AS "REGIO", TRIM("PSTLZ") AS "PSTLZ",
        TRIM("LAND1") AS "LAND1"
      FROM (SELECT COLUMNS(*)::VARCHAR FROM delta_scan('${SOURCE_FOLDER}/t001w'))
      WHERE "WERKS" IS NOT NULL AND TRIM("WERKS") <> ''

  mcha:
    kind: sql
    extensions: [delta]
    primaryKey: [MATNR, WERKS, CHARG]
    sql: |
      SELECT
        REGEXP_REPLACE(TRIM(a."MATNR"), '^0+(.)', '\1') AS "MATNR",
        TRIM(a."WERKS") AS "WERKS", TRIM(a."CHARG") AS "CHARG",
        CASE WHEN regexp_matches(TRIM(a."ERSDA"), '^[0-9]{8}$')
          THEN SUBSTR(TRIM(a."ERSDA"),1,4)||'-'||SUBSTR(TRIM(a."ERSDA"),5,2)||'-'||SUBSTR(TRIM(a."ERSDA"),7,2)
          ELSE NULLIF(TRIM(a."ERSDA"),'') END AS "ERSDA",
        CASE WHEN regexp_matches(TRIM(a."VFDAT"), '^[0-9]{8}$')
          THEN SUBSTR(TRIM(a."VFDAT"),1,4)||'-'||SUBSTR(TRIM(a."VFDAT"),5,2)||'-'||SUBSTR(TRIM(a."VFDAT"),7,2)
          ELSE NULLIF(TRIM(a."VFDAT"),'') END AS "VFDAT",
        COALESCE(m."MEINS", 'PC') AS "MEINS"
      FROM (SELECT COLUMNS(*)::VARCHAR FROM delta_scan('${SOURCE_FOLDER}/mcha')) a
      LEFT JOIN (
        SELECT DISTINCT ON (REGEXP_REPLACE(TRIM("MATNR"), '^0+(.)', '\1'))
          REGEXP_REPLACE(TRIM("MATNR"), '^0+(.)', '\1') AS "MATNR", TRIM("MEINS") AS "MEINS"
        FROM (SELECT COLUMNS(*)::VARCHAR FROM delta_scan('${SOURCE_FOLDER}/mara'))
      ) m ON m."MATNR" = REGEXP_REPLACE(TRIM(a."MATNR"), '^0+(.)', '\1')
      WHERE a."CHARG" IS NOT NULL AND TRIM(a."CHARG") <> ''
        AND a."MATNR" IS NOT NULL AND TRIM(a."MATNR") <> ''

  # Batch stock (CLABS/CINSM/CEINM/CSPEM) lives on the generator's MCHA rather
  # than a separate MCHB, so this reads the same file for the stored-at link.
  mchb:
    kind: sql
    extensions: [delta]
    primaryKey: [MATNR, WERKS, CHARG]
    sql: |
      SELECT
        REGEXP_REPLACE(TRIM(b."MATNR"), '^0+(.)', '\1') AS "MATNR",
        TRIM(b."WERKS") AS "WERKS", TRIM(b."CHARG") AS "CHARG",
        SUM(TRY_CAST(b."CLABS" AS DOUBLE)) AS "CLABS",
        SUM(TRY_CAST(b."CINSM" AS DOUBLE)) AS "CINSM",
        SUM(TRY_CAST(b."CEINM" AS DOUBLE)) AS "CEINM",
        SUM(TRY_CAST(b."CSPEM" AS DOUBLE)) AS "CSPEM",
        COALESCE(ANY_VALUE(m."MEINS"), 'PC') AS "MEINS"
      FROM (SELECT COLUMNS(*)::VARCHAR FROM delta_scan('${SOURCE_FOLDER}/mcha')) b
      LEFT JOIN (
        SELECT DISTINCT ON (REGEXP_REPLACE(TRIM("MATNR"), '^0+(.)', '\1'))
          REGEXP_REPLACE(TRIM("MATNR"), '^0+(.)', '\1') AS "MATNR", TRIM("MEINS") AS "MEINS"
        FROM (SELECT COLUMNS(*)::VARCHAR FROM delta_scan('${SOURCE_FOLDER}/mara'))
      ) m ON m."MATNR" = REGEXP_REPLACE(TRIM(b."MATNR"), '^0+(.)', '\1')
      WHERE TRIM(b."CHARG") <> '' AND COALESCE(TRIM(b."LVORM"), '') <> 'X'
        AND TRIM(b."WERKS") IN (${MOVEMENT_SITES})
      GROUP BY 1, 2, 3

  # SAP language key (SPRAS) -> name; join via `inputs` to label a language code.
  language_names:
    kind: sql
    extensions: [delta]
    primaryKey: CODE
    sql: |
      SELECT "CODE", "LANGUAGE" FROM (VALUES
        ('E','English'),   ('EN','English'),
        ('D','German'),    ('DE','German'),
        ('F','French'),    ('FR','French'),
        ('S','Spanish'),   ('ES','Spanish'),
        ('I','Italian'),   ('IT','Italian'),
        ('P','Portuguese'),('PT','Portuguese'),
        ('N','Dutch'),     ('NL','Dutch'),
        ('J','Japanese'),  ('JA','Japanese'),
        ('RU','Russian'),  ('KO','Korean'),   ('TH','Thai'),
        ('VI','Vietnamese'),('RO','Romanian'),('AR','Arabic'),
        ('HU','Hungarian'),('TR','Turkish'),  ('PL','Polish'), ('ZH','Chinese')
      ) AS t("CODE","LANGUAGE")

pipelines:
  entities:
    - source: language_names
      steps:
        - id: cp-language-names
          kind: checkpoint
          name: sap/language_names

    - source: makt
      inputs:
        matdoc_ref: sap/matdoc
        ekpo_ref: sap/ekpo
        vbap_ref: sap/vbap
        afpo_ref: sap/afpo
        lips_ref: sap/lips
        resb_ref: sap/resb
        mast_ref: sap/mast
        mat_ref: sap/site_materials
        lang: sap/language_names
      steps:
        - id: makt-gate
          kind: sql
          sql: >
            SELECT i.* FROM input i
            WHERE REGEXP_REPLACE(TRIM(i."MATNR"), '^0+(.)', '\1') IN (SELECT "MATNR" FROM mat_ref)
            AND REGEXP_REPLACE(TRIM(i."MATNR"), '^0+(.)', '\1') IN (
              SELECT "MATNR" FROM matdoc_ref
              UNION
              SELECT "MATNR" FROM ekpo_ref
              UNION
              SELECT "MATNR" FROM vbap_ref
              UNION
              SELECT "MATNR" FROM afpo_ref
              UNION
              SELECT "MATNR" FROM lips_ref
              UNION
              SELECT "MATNR" FROM resb_ref
              UNION
              SELECT "MATNR" FROM mast_ref
            )
        - id: makt-dedup
          kind: sql
          sql: 'SELECT DISTINCT ON ("MATNR") * FROM input'
        - id: makt-language
          kind: sql
          sql: >
            SELECT i.*, COALESCE(lang."LANGUAGE", i."SPRAS") AS "LANGUAGE_NAME"
            FROM input i LEFT JOIN lang ON UPPER(TRIM(i."SPRAS")) = lang."CODE"
        - id: graph-makt
          kind: graph-sink
          config:
            entityType: "https://hash.ai/@h/types/entity-type/material/v/1"
            entityId: MATNR
            webId: "${HASH_WEB_ID}"
            properties:
              "https://blockprotocol.org/@blockprotocol/types/property-type/name/v/1": MAKTX
              "https://hash.ai/@h/types/property-type/language/v/1": LANGUAGE_NAME
              "https://hash.ai/@h/types/property-type/material-number/v/1": MATNR
              "https://hash.ai/@h/types/property-type/material-type/v/1": MTART
              "https://hash.ai/@h/types/property-type/material-group/v/1": MATKL
              "https://hash.ai/@h/types/property-type/unit-of-measure/v/1": MEINS
              "https://hash.ai/@h/types/property-type/status/v/1": MSTAE
        - id: cp-makt
          kind: checkpoint
          name: sap/makt

    - source: kna1
      inputs:
        vbak_ref: sap/vbak
        likp_ref: sap/likp
      steps:
        - id: kna1-gate
          kind: sql
          sql: >
            SELECT i.* FROM input i
            WHERE REGEXP_REPLACE(TRIM(i."KUNNR"), '^0+(.)', '\1') IN (
              SELECT "KUNNR" FROM vbak_ref
              UNION
              SELECT "KUNNR" FROM likp_ref
            )
        - id: kna1-norm
          kind: sql
          sql: >
            SELECT * REPLACE (
              REGEXP_REPLACE(TRIM("KUNNR"), '^0+(.)', '\1') AS "KUNNR"
            ) FROM input
        - id: kna1-dedup
          kind: sql
          sql: 'SELECT DISTINCT ON ("KUNNR") * FROM input'
        - id: graph-kna1
          kind: graph-sink
          config:
            entityType: "https://hash.ai/@h/types/entity-type/customer/v/1"
            entityId: KUNNR
            webId: "${HASH_WEB_ID}"
            properties:
              "https://blockprotocol.org/@blockprotocol/types/property-type/name/v/1": NAME1
              "https://hash.ai/@h/types/property-type/customer-number/v/1": KUNNR
              "https://hash.ai/@h/types/property-type/city/v/1": ORT01
              "https://hash.ai/@h/types/property-type/postal-code/v/1": PSTLZ
              "https://hash.ai/@h/types/property-type/country/v/1": LAND1
              "https://hash.ai/@h/types/property-type/street-address/v/1": STRAS
              "https://hash.ai/@h/types/property-type/region/v/1": REGIO
              "https://hash.ai/@h/types/property-type/industry/v/1": BRSCH
            provenanceFields:
              authors: ERNAM
              firstPublished: { column: ERDAT, coerce: date }
        - id: cp-kna1
          kind: checkpoint
          name: sap/kna1

    - source: vbak
      inputs:
        vbap_keys_ref: sap/vbap_keys
      steps:
        - id: vbak-gate
          kind: sql
          sql: >
            SELECT i.* FROM input i
            WHERE REGEXP_REPLACE(TRIM(i."VBELN"), '^0+(.)', '\1') IN (SELECT "VBELN" FROM vbap_keys_ref)
        - id: vbak-norm
          kind: sql
          sql: >
            SELECT * REPLACE (
              REGEXP_REPLACE(TRIM("VBELN"), '^0+(.)', '\1') AS "VBELN",
              REGEXP_REPLACE(TRIM("KUNNR"), '^0+(.)', '\1') AS "KUNNR"
            ) FROM input
        - id: vbak-dedup
          kind: sql
          sql: 'SELECT DISTINCT ON ("VBELN") * FROM input'
        - id: graph-vbak
          kind: graph-sink
          config:
            entityType: "https://hash.ai/@h/types/entity-type/sales-order/v/1"
            entityId: VBELN
            webId: "${HASH_WEB_ID}"
            properties:
              "https://hash.ai/@h/types/property-type/sales-order-number/v/1": VBELN
              "https://hash.ai/@h/types/property-type/sales-document-type/v/1": AUART
              "https://hash.ai/@h/types/property-type/sales-organization/v/1": VKORG
              "https://hash.ai/@h/types/property-type/distribution-channel/v/1": VTWEG
              "https://hash.ai/@h/types/property-type/division/v/1": SPART
              "https://hash.ai/@h/types/property-type/customer-reference/v/1": BSTNK
              "https://hash.ai/@h/types/property-type/currency-code/v/1": WAERK
              "https://hash.ai/@h/types/property-type/net-value/v/1": { amount: NETWR, unit: WAERK, measure: currency }
              "https://hash.ai/@h/types/property-type/order-date/v/1": { column: AUDAT, coerce: date }
              "https://hash.ai/@h/types/property-type/requested-delivery-date/v/1": { column: VDATU, coerce: date }
            provenanceFields:
              authors: ERNAM
              firstPublished: { column: ERDAT, coerce: date }
        - id: cp-vbak
          kind: checkpoint
          name: sap/vbak

    - source: marc
      steps:
        - id: marc-norm
