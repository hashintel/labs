              "https://hash.ai/@h/types/property-type/unit-of-measure/v/1": BMEIN
              "https://hash.ai/@h/types/property-type/bom-status/v/1": LKENZ
              "https://hash.ai/@h/types/property-type/alternative-bom/v/1": STLAL
        - id: cp-stko
          kind: checkpoint
          name: sap/stko

    - source: stpo
      inputs:
        mast_ref: sap/mast
      steps:
        - id: stpo-gate
          kind: sql
          sql: >
            SELECT i.* FROM input i
            WHERE REGEXP_REPLACE(TRIM(i."STLNR"), '^0+(.)', '\1') IN (SELECT "STLNR" FROM mast_ref)
        - id: stpo-norm
          kind: sql
          sql: >
            SELECT * REPLACE (
              REGEXP_REPLACE(TRIM("STLNR"), '^0+(.)', '\1') AS "STLNR",
              REGEXP_REPLACE(TRIM("IDNRK"), '^0+(.)', '\1') AS "IDNRK"
            ) FROM input
        - id: stpo-id
          kind: sql
          sql: >
            SELECT DISTINCT ON (CONCAT_WS('::', "STLTY", "STLNR", "STLKN"))
              _op, _key, _before,
              CONCAT_WS('::', "STLTY", "STLNR", "STLKN")::VARCHAR AS "_sap_id",
              * EXCLUDE (_op, _key, _before)
            FROM input
        - id: graph-stpo
          kind: graph-sink
          config:
            entityType: "https://hash.ai/@h/types/entity-type/bill-of-materials-item/v/1"
            entityId: _sap_id
            webId: "${HASH_WEB_ID}"
            properties:
              "https://hash.ai/@h/types/property-type/item-number/v/1": STLKN
              "https://hash.ai/@h/types/property-type/component-quantity/v/1": { amount: MENGE, unit: MEINS, measure: quantity }
              "https://hash.ai/@h/types/property-type/scrap-percentage/v/1": { column: AUSCH, coerce: number }
              "https://hash.ai/@h/types/property-type/item-category/v/1": POSTP
              "https://hash.ai/@h/types/property-type/fixed-quantity-indicator/v/1": FMENG
        - id: cp-stpo
          kind: checkpoint
          name: sap/stpo

    - source: resb
      inputs:
        afko_ref: sap/afko
      steps:
        - id: resb-gate
          kind: sql
          sql: >
            SELECT i.* FROM input i
            WHERE REGEXP_REPLACE(TRIM(i."AUFNR"), '^0+(.)', '\1') IN (
              SELECT "AUFNR" FROM afko_ref
            )
        - id: resb-norm
          kind: sql
          sql: >
            SELECT * REPLACE (
              REGEXP_REPLACE(TRIM("MATNR"), '^0+(.)', '\1') AS "MATNR",
              REGEXP_REPLACE(TRIM("AUFNR"), '^0+(.)', '\1') AS "AUFNR"
            ) FROM input
        - id: resb-id
          kind: sql
          sql: >
            SELECT DISTINCT ON (CONCAT_WS('::', "RSNUM", "RSPOS"))
              _op, _key, _before,
              CONCAT_WS('::', "RSNUM", "RSPOS")::VARCHAR AS "_sap_id",
              * EXCLUDE (_op, _key, _before)
            FROM input
        - id: graph-resb
          kind: graph-sink
          config:
            entityType: "https://hash.ai/@h/types/entity-type/material-reservation/v/1"
            entityId: _sap_id
            webId: "${HASH_WEB_ID}"
            properties:
              "https://hash.ai/@h/types/property-type/requirement-quantity/v/1": { amount: BDMNG, unit: MEINS, measure: quantity }
              "https://hash.ai/@h/types/property-type/withdrawn-quantity/v/1": { amount: ENMNG, unit: MEINS, measure: quantity }
              "https://hash.ai/@h/types/property-type/stock-direction/v/1": MVT_DIRECTION
        - id: cp-resb
          kind: checkpoint
          name: sap/resb

    - source: vttk
      inputs:
        vttp_ref: sap/vttp
      steps:
        - id: vttk-gate
          kind: sql
          sql: >
            SELECT i.* FROM input i
            WHERE REGEXP_REPLACE(TRIM(i."TKNUM"), '^0+(.)', '\1') IN (
              SELECT REGEXP_REPLACE(TRIM("TKNUM"), '^0+(.)', '\1') FROM vttp_ref
            )
        - id: vttk-norm
          kind: sql
          sql: >
            SELECT * REPLACE (
              REGEXP_REPLACE(TRIM("TKNUM"), '^0+(.)', '\1') AS "TKNUM"
            ) FROM input
        - id: vttk-dedup
          kind: sql
          sql: 'SELECT DISTINCT ON ("TKNUM") * FROM input'
        - id: graph-vttk
          kind: graph-sink
          config:
            entityType: "https://hash.ai/@h/types/entity-type/shipment/v/1"
            entityId: TKNUM
            webId: "${HASH_WEB_ID}"
            properties:
              "https://hash.ai/@h/types/property-type/shipment-number/v/1": TKNUM
              "https://hash.ai/@h/types/property-type/route/v/1": ROUTE
              "https://hash.ai/@h/types/property-type/actual-departure-date/v/1": { column: DATBG, coerce: date }
              "https://hash.ai/@h/types/property-type/actual-shipment-completion-date/v/1": { column: DTABF, coerce: date }
              "https://hash.ai/@h/types/property-type/actual-shipment-end-date/v/1": { column: DATEN, coerce: date }
              "https://hash.ai/@h/types/property-type/planned-shipment-end-date/v/1": { column: DPTEN, coerce: date }
            provenanceFields:
              authors: ERNAM
              firstPublished: { column: ERDAT, coerce: date }
        - id: cp-vttk
          kind: checkpoint
          name: sap/vttk

    - source: vttp
      inputs:
        likp_ref: sap/likp
      steps:
        - id: vttp-gate
          kind: sql
          sql: >
            SELECT i.* FROM input i
            WHERE REGEXP_REPLACE(TRIM(i."VBELN"), '^0+(.)', '\1') IN (SELECT "VBELN" FROM likp_ref)
        - id: vttp-id
          kind: sql
          sql: >
            SELECT DISTINCT ON (CONCAT_WS('::', "TKNUM", "TPNUM"))
              _op, _key, _before,
              CONCAT_WS('::', "TKNUM", "TPNUM")::VARCHAR AS "_sap_id",
              * EXCLUDE (_op, _key, _before)
            FROM input
        - id: graph-vttp
          kind: graph-sink
          config:
            entityType: "https://hash.ai/@h/types/entity-type/shipment-item/v/1"
            entityId: _sap_id
            webId: "${HASH_WEB_ID}"
            properties:
              "https://hash.ai/@h/types/property-type/shipment-item-number/v/1": TPNUM
              "https://hash.ai/@h/types/property-type/delivery-number/v/1": VBELN
        - id: cp-vttp
          kind: checkpoint
          name: sap/vttp

    - source: t001w
      inputs:
        matdoc_ref: sap/matdoc
        ekpo_ref: sap/ekpo
        afpo_ref: sap/afpo
        lips_ref: sap/lips
        resb_ref: sap/resb
      steps:
        - id: t001w-gate
          kind: sql
          sql: >
            SELECT i.* FROM input i
            WHERE TRIM(i."WERKS") IN (
              SELECT TRIM("WERKS") FROM matdoc_ref
              UNION
              SELECT TRIM("WERKS") FROM ekpo_ref
              UNION
              SELECT TRIM("DWERK") FROM afpo_ref
              UNION
              SELECT TRIM("WERKS") FROM lips_ref
              UNION
              SELECT TRIM("WERKS") FROM resb_ref
            )
        - id: t001w-dedup
          kind: sql
          sql: 'SELECT DISTINCT ON ("WERKS") * FROM input'
        - id: graph-t001w
          kind: graph-sink
          config:
            entityType: "${HASH_TYPE_BASE}/entity-type/site/v/1"
            entityId: WERKS
            webId: "${HASH_WEB_ID}"
            properties:
              "https://blockprotocol.org/@blockprotocol/types/property-type/name/v/1": NAME1
              "${HASH_TYPE_BASE}/property-type/site-code/v/1": WERKS
              "${HASH_TYPE_BASE}/property-type/street-address/v/1": STRAS
              "${HASH_TYPE_BASE}/property-type/city/v/1": ORT01
              "${HASH_TYPE_BASE}/property-type/region/v/1": REGIO
              "${HASH_TYPE_BASE}/property-type/postal-code/v/1": PSTLZ
              "${HASH_TYPE_BASE}/property-type/country/v/1": LAND1
        - id: cp-t001w
          kind: checkpoint
          name: sap/t001w

    - source: mcha
      inputs:
        matdoc_ref: sap/matdoc
        lips_ref: sap/lips
      steps:
        - id: mcha-gate
          kind: sql
          sql: >
            SELECT i.* FROM input i
            WHERE CONCAT_WS('::', REGEXP_REPLACE(TRIM(i."MATNR"), '^0+(.)', '\1'), TRIM(i."CHARG")) IN (
              SELECT CONCAT_WS('::', "MATNR", TRIM("CHARG")) FROM matdoc_ref WHERE TRIM("CHARG") <> ''
              UNION
              SELECT CONCAT_WS('::', "MATNR", TRIM("CHARG")) FROM lips_ref WHERE TRIM("CHARG") <> ''
            )
        - id: cp-batch-pairs
          kind: checkpoint
          name: sap/batch_pairs
        - id: mcha-id
          kind: sql
          sql: >
            SELECT DISTINCT ON ("CHARG")
              _op, _key, _before,
              "CHARG"::VARCHAR AS "_sap_id",
              * EXCLUDE (_op, _key, _before)
            FROM input
        - id: graph-mcha
          kind: graph-sink
          config:
            entityType: "${HASH_TYPE_BASE}/entity-type/batch/v/1"
            entityId: _sap_id
            webId: "${HASH_WEB_ID}"
            properties:
              "${HASH_TYPE_BASE}/property-type/batch-number/v/1": CHARG
        - id: cp-mcha
          kind: checkpoint
          name: sap/batch

    - source: mchb
      inputs:
        batch_ref: sap/batch
        site_ref: sap/t001w
      steps:
        - id: mchb-gate
          kind: sql
          sql: >
            SELECT i.* FROM input i
            WHERE TRIM(i."CHARG") IN (SELECT "_sap_id" FROM batch_ref)
              AND TRIM(i."WERKS") IN (SELECT "WERKS" FROM site_ref)
        - id: cp-batch-stock
          kind: checkpoint
          name: sap/batch_stock

  links:
