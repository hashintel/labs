connector:
  id: flightaware
  mode: batch

sources:
  arrivals:
    kind: sql
    primaryKey: fa_flight_id
    partial: true
    sql: |
      SELECT * FROM (VALUES
        (
          'BAW115-1715000000-schedule-0001', 'BA115', 'BAW115', 'Airline',
          '{"code_icao": "KJFK", "name": "John F Kennedy Intl", "code_iata": "JFK", "timezone": "America/New_York", "city": "New York"}'::JSON,
          '{"code_icao": "EGLL", "name": "Heathrow", "code_iata": "LHR", "timezone": "Europe/London", "city": "London"}'::JSON,
          'BAW', 'BA', 'British Airways',
          false, false,
          'A10', 'T5', 'A10', NULL,
          '2024-05-06T22:00:00Z', '2024-05-06T22:05:00Z', '2024-05-06T22:10:00Z', '2024-05-06T22:15:00Z',
          'B22', 'T5', 'B22', '5',
          120, -300,
          '2024-05-07T06:00:00Z', '2024-05-07T05:55:00Z', '2024-05-07T06:05:00Z', '2024-05-07T06:00:00Z'
        ),
        (
          'DLH901-1715000000-schedule-0002', 'LH901', 'DLH901', 'Airline',
          '{"code_icao": "EDDF", "name": "Frankfurt am Main", "code_iata": "FRA", "timezone": "Europe/Berlin", "city": "Frankfurt"}'::JSON,
          '{"code_icao": "EGLL", "name": "Heathrow", "code_iata": "LHR", "timezone": "Europe/London", "city": "London"}'::JSON,
          'DLH', 'LH', 'Lufthansa',
          false, false,
          NULL, 'T1', NULL, NULL,
          '2024-05-07T07:00:00Z', '2024-05-07T07:10:00Z', '2024-05-07T07:15:00Z', NULL,
          'C15', 'T2', NULL, '7',
          NULL, 600,
          '2024-05-07T08:30:00Z', '2024-05-07T08:40:00Z', '2024-05-07T08:35:00Z', NULL
        ),
        (
          'UAE5-1715000000-schedule-0003', 'EK5', 'UAE5', 'Airline',
          '{"code_icao": "OMDB", "name": "Dubai Intl", "code_iata": "DXB", "timezone": "Asia/Dubai", "city": "Dubai"}'::JSON,
          '{"code_icao": "EGLL", "name": "Heathrow", "code_iata": "LHR", "timezone": "Europe/London", "city": "London"}'::JSON,
          'UAE', 'EK', 'Emirates',
          true, false,
          NULL, NULL, NULL, NULL,
          '2024-05-07T09:00:00Z', NULL, NULL, NULL,
          NULL, NULL, NULL, NULL,
          NULL, NULL,
          '2024-05-07T14:00:00Z', NULL, NULL, NULL
        )
      ) AS t(
        fa_flight_id, ident_iata, ident_icao, type,
        origin, destination,
        operator_icao, operator_iata, operator,
        cancelled, diverted,
        gate_origin, terminal_origin, actual_runway_off, departure_delay,
        scheduled_out, actual_out, scheduled_off, actual_off,
        gate_destination, terminal_destination, actual_runway_on, baggage_claim,
        arrival_delay, departure_delay_secs,
        scheduled_in, actual_in, scheduled_on, actual_on
      )

pipelines:
  - source: arrivals
    steps:
      - id: cleanup
        kind: sql
        sql: >
          SELECT _op, _key, _before, * EXCLUDE (_op, _key, _before)
          FROM input WHERE ident_iata IS NOT NULL AND fa_flight_id IS NOT NULL

      - id: extract
        kind: branch
        branches:
          - - id: norm-airports
              kind: sql
              sql: |
                SELECT DISTINCT ON (icaoCode)
                  _op, _key, _before, icaoCode, name, iataCode, timezone, city
                FROM (
                  SELECT _op, _key, _before,
                    origin->>'code_icao' AS icaoCode,
                    origin->>'name' AS name,
                    origin->>'code_iata' AS iataCode,
                    origin->>'timezone' AS timezone,
                    origin->>'city' AS city
                  FROM input WHERE origin->>'code_icao' IS NOT NULL
                  UNION ALL
                  SELECT _op, _key, _before,
                    destination->>'code_icao' AS icaoCode,
                    destination->>'name' AS name,
                    destination->>'code_iata' AS iataCode,
                    destination->>'timezone' AS timezone,
                    destination->>'city' AS city
                  FROM input WHERE destination->>'code_icao' IS NOT NULL
                ) airports

            - id: write-airports
              kind: graph-sink
              config:
                entityType: "https://hash.ai/@h/types/entity-type/airport/v/1"
                entityId: icaoCode
                webId: "${HASH_WEB_ID}"
                properties:
                  "https://blockprotocol.org/@blockprotocol/types/property-type/name/v/1": name
                  "https://hash.ai/@h/types/property-type/icao-code/v/1": icaoCode
                  "https://hash.ai/@h/types/property-type/iata-code/v/1": iataCode
                  "https://hash.ai/@h/types/property-type/timezone/v/1": timezone
                  "https://hash.ai/@h/types/property-type/city/v/1": city
                provenance:
                  location:
                    name: FlightAware AeroAPI
                    uri: https://aeroapi.flightaware.com/aeroapi/

          - - id: norm-airlines
              kind: sql
              sql: |
                SELECT DISTINCT ON (icaoCode) _op, _key, _before, icaoCode, iataCode, name
                FROM (
                  SELECT _op, _key, _before,
                    operator_icao AS icaoCode,
                    operator_iata AS iataCode,
                    COALESCE(operator, operator_icao, operator_iata) AS name
                  FROM input WHERE operator_icao IS NOT NULL
                ) airlines

            - id: write-airlines
              kind: graph-sink
              config:
                entityType: "https://hash.ai/@h/types/entity-type/airline/v/1"
                entityId: icaoCode
                webId: "${HASH_WEB_ID}"
                properties:
                  "https://blockprotocol.org/@blockprotocol/types/property-type/name/v/1": name
                  "https://hash.ai/@h/types/property-type/icao-code/v/1": icaoCode
                  "https://hash.ai/@h/types/property-type/iata-code/v/1": iataCode
                provenance:
                  location:
                    name: FlightAware AeroAPI
                    uri: https://aeroapi.flightaware.com/aeroapi/

          - - id: norm-flights
              kind: sql
              sql: |
                SELECT
                  _op, _key, _before,
                  fa_flight_id AS flightId,
                  ident_iata AS flightNumber,
                  ident_icao AS icaoCode,
                  ident_iata AS iataCode,
                  type AS flightType,
                  CASE
                    WHEN cancelled THEN 'Cancelled'
                    WHEN diverted THEN 'Diverted'
                    WHEN actual_on IS NOT NULL THEN 'Landed'
                    WHEN actual_off IS NOT NULL OR actual_out IS NOT NULL THEN 'Active'
                    ELSE 'Scheduled'
                  END AS flightStatus,
                  COALESCE(
                    scheduled_out, scheduled_off,
                    actual_out, actual_off, scheduled_in, scheduled_on
                  )::DATE::VARCHAR AS flightDate,
                  origin->>'code_icao' AS originIcao,
                  destination->>'code_icao' AS destIcao,
                  operator_icao AS airlineIcao,
                  gate_origin AS departGate,
                  terminal_origin AS departTerminal,
                  actual_runway_off AS departRunway,
                  departure_delay AS departDelay,
                  scheduled_out AS departSchedGate,
                  actual_out AS departActGate,
                  scheduled_off AS departSchedRunway,
                  actual_off AS departActRunway,
                  gate_destination AS arriveGate,
                  terminal_destination AS arriveTerminal,
                  actual_runway_on AS arriveRunway,
                  baggage_claim AS arriveBaggage,
                  arrival_delay AS arriveDelay,
                  scheduled_in AS arriveSchedGate,
                  actual_in AS arriveActGate,
                  scheduled_on AS arriveSchedRunway,
                  actual_on AS arriveActRunway
                FROM input

            - id: write-flights
              kind: graph-sink
              config:
                entityType: "https://hash.ai/@h/types/entity-type/flight/v/1"
                entityId: flightId
                webId: "${HASH_WEB_ID}"
                properties:
                  "https://hash.ai/@h/types/property-type/flight-number/v/1": flightNumber
                  "https://hash.ai/@h/types/property-type/icao-code/v/1": icaoCode
                  "https://hash.ai/@h/types/property-type/iata-code/v/1": iataCode
                  "https://hash.ai/@h/types/property-type/flight-type/v/1": flightType
                  "https://hash.ai/@h/types/property-type/flight-status/v/1": flightStatus
                  "https://hash.ai/@h/types/property-type/flight-date/v/1": flightDate
                links:
                  - column: originIcao
                    linkType: "https://hash.ai/@h/types/entity-type/departs-from/v/1"
                    targetEntityType: "https://hash.ai/@h/types/entity-type/airport/v/1"
                    properties:
                      "https://hash.ai/@h/types/property-type/gate/v/1": departGate
                      "https://hash.ai/@h/types/property-type/terminal/v/1": departTerminal
                      "https://hash.ai/@h/types/property-type/runway/v/1": departRunway
                      "https://hash.ai/@h/types/property-type/delay-in-seconds/v/1":
                        column: departDelay
                        coerce: nullable_number
                      "https://hash.ai/@h/types/property-type/scheduled-gate-time/v/1": departSchedGate
                      "https://hash.ai/@h/types/property-type/actual-gate-time/v/1": departActGate
                      "https://hash.ai/@h/types/property-type/scheduled-runway-time/v/1": departSchedRunway
                      "https://hash.ai/@h/types/property-type/actual-runway-time/v/1": departActRunway
                  - column: destIcao
                    linkType: "https://hash.ai/@h/types/entity-type/arrives-at/v/1"
                    targetEntityType: "https://hash.ai/@h/types/entity-type/airport/v/1"
                    properties:
                      "https://hash.ai/@h/types/property-type/gate/v/1": arriveGate
                      "https://hash.ai/@h/types/property-type/terminal/v/1": arriveTerminal
                      "https://hash.ai/@h/types/property-type/runway/v/1": arriveRunway
                      "https://hash.ai/@h/types/property-type/baggage-claim/v/1": arriveBaggage
                      "https://hash.ai/@h/types/property-type/delay-in-seconds/v/1":
                        column: arriveDelay
                        coerce: nullable_number
                      "https://hash.ai/@h/types/property-type/scheduled-gate-time/v/1": arriveSchedGate
                      "https://hash.ai/@h/types/property-type/actual-gate-time/v/1": arriveActGate
                      "https://hash.ai/@h/types/property-type/scheduled-runway-time/v/1": arriveSchedRunway
                      "https://hash.ai/@h/types/property-type/actual-runway-time/v/1": arriveActRunway
                  - column: airlineIcao
                    linkType: "https://hash.ai/@h/types/entity-type/operated-by/v/1"
                    targetEntityType: "https://hash.ai/@h/types/entity-type/airline/v/1"
                provenance:
                  location:
                    name: FlightAware AeroAPI
                    uri: https://aeroapi.flightaware.com/aeroapi/

orchestration:
  maxRetries: 2
