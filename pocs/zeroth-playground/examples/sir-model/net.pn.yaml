name: sir_epidemic_model
description: 'An SIR epidemic with constant rates: infection makes a susceptible person infected, and recovery moves an infected person to recovered.'
kind: stochastic

places:
  Susceptible:
  Infected:
  Recovered:

transitions:
  Infection:
    inputs:
      Susceptible:
      Infected:
    outputs:
      Infected:
        weight: 2
    rate: 3
  Recovery:
    inputs:
      Infected:
    outputs:
      Recovered:
    rate: 1

marking:
  Susceptible: 9
  Infected: 1
