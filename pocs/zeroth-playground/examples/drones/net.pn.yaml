name: drones
kind: mixed

colours:
  Drone:
    battery: real
    state:
      enum:
        - idle
        - flying

dynamics:
  Drain:
    colour: Drone
    code: |
      return tokens.map((d) => ({ battery: -2.5 }));

places:
  Hangar:
    colour: Drone
    capacity: 3
  Airborne:
    colour: Drone
    capacity: 3
    dynamics: Drain
  Sorties:

transitions:
  Launch:
    inputs:
      Hangar:
    outputs:
      Airborne:
      Sorties:
    rate: |
      return 0.6 * (input.Hangar[0].battery / 100);
    kernel: |
      const d = input.Hangar[0];
      return { Airborne: [{ battery: d.battery, state: "flying" }] };
  Land:
    inputs:
      Airborne:
    outputs:
      Hangar:
    guard: |
      return input.Airborne[0].battery < 20 || input.Airborne[0].state !== "flying";
    kernel: |
      return { Hangar: [{ battery: 100, state: "idle" }] };

marking:
  Hangar:
    - {battery: 100, state: idle}
    - {battery: 60, state: idle}
